// ---- accordion -------------------------------------------------------------------------------
// The Watches tab is Targets above Messages. Each folds away (the other then takes the height) and the choice is kept.
const accOpen = {targets: true, msgs: true};
function setAcc(name, open, save = true) {
  accOpen[name] = open;
  $('#acc-' + name).classList.toggle('open', open);
  $('#chev-' + name).textContent = open ? '\u25be' : '\u25b8';
  $('#tab-watch').classList.toggle('msgs-closed', !accOpen.msgs);
  if (save) { try { localStorage.setItem('acc-' + name, open ? '1' : '0'); } catch (e) { /* not saved: fine */ } }
}
for (const name of ['targets', 'msgs']) {
  let open = true;
  try { open = localStorage.getItem('acc-' + name) !== '0'; } catch (e) { /* default: open */ }
  setAcc(name, open, false);
  $('#acchead-' + name).onclick = () => setAcc(name, !accOpen[name]);
}

// ---- fix search -----------------------------------------------------------------------------
// The waypoints we hold: positions learned from the aircraft's own messages, and the navigation
// database. The list is searched on the server; the one chosen is drawn here, in its own groups,
// which a refresh of the watches never clears.
const fixGroup = L.layerGroup().addTo(map);     // the fix chosen in the list, with others of the same name
const fixAllGroup = L.layerGroup().addTo(map);  // every learned fix, when asked for
const FIX_HOW = {'adsc-eta': 'ADS-C predicted ETA', 'adsc-chain': 'ADS-C route order', 'adsc-wpt': 'ADS-C waypoint event'};
let fixData = null, fixChosen = null, fixTimer = null, fixSeq = 0;
const fixKey = f => `${f.kind}|${f.name}|${f.lat.toFixed(3)}|${f.lon.toFixed(3)}`;
const nearLon = (lon, ref) => lon + 360 * Math.round((ref - lon) / 360);
const coord = f => `${Math.abs(f.lat).toFixed(3)}°${f.lat < 0 ? 'S' : 'N'} ${Math.abs(f.lon).toFixed(3)}°${f.lon < 0 ? 'W' : 'E'}`;

// What is known of a fix, one line each.
function fixLines(f) {
  const lines = [coord(f)];
  if (f.kind !== 'learned') {
    lines.push(`nav db (${fixData && fixData.database_cycle ? fixData.database_cycle.slice(0, 4) : 'downloaded'} src) · ${f.kind}`);
    return lines;
  }
  lines.push(`learned from ${f.n} message${f.n === 1 ? '' : 's'} · ${(f.sources || []).map(x => FIX_HOW[x] || x).join(', ')}`);
  if (f.first) lines.push(`first heard ${fmtAgo(f.first)}`, `last confirmed ${fmtAgo(f.last)}`);
  else lines.push('the messages that taught it are no longer stored');
  if (f.db_nm != null) lines.push(`nav db: ${f.db_nm < 0.1 ? 'same place' : f.db_nm.toFixed(1) + ' nm away'}`);
  else if (fixData && fixData.database_names) lines.push('not in nav db');
  return lines;
}

function fixTip(f) {
  const d = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = f.name;
  d.append(b);
  for (const l of fixLines(f)) { const e = document.createElement('div'); e.textContent = l; d.append(e); }
  return d;
}

function fixMarker(f, chosen) {
  const m = L.marker(ll2(f), {icon: L.divIcon({className: 'fixpin-wrap', iconSize: [18, 18], iconAnchor: [9, 9], html: `<div class="fixpin ${f.kind === 'learned' ? 'learned' : 'db'}"></div>`}),
                              zIndexOffset: chosen ? 1000 : 0});
  m.bindTooltip(fixTip(f), {permanent: chosen, direction: 'right', offset: [10, 0]});
  return m;
}
// A fix drawn one world over from the map's centre is hard to find: pick the copy nearest it.
function ll2(f) { return [f.lat, nearLon(f.lon, map.getCenter ? map.getCenter().lng : 0)]; }

// Draw a fix (and any other of the same name, which is a reused name) and move the map to it.
function showFix(f) {
  fixChosen = fixKey(f);
  fixGroup.clearLayers();
  for (const g of (fixData && fixData.fixes || []).filter(g => g.name === f.name)) fixMarker(g, fixKey(g) === fixChosen).addTo(fixGroup);
  map.setView(ll2(f), Math.max(map.getZoom ? map.getZoom() : 0, 6));
  renderFixes();
}

function renderFixes() {
  const ul = $('#fixlist');
  const all = fixData ? fixData.fixes : [];
  const learned = all.filter(f => f.kind === 'learned'), db = all.filter(f => f.kind !== 'learned');
  const by = $('#fixsort').value;
  if (by === 'last') learned.sort((a, b) => (b.last || '').localeCompare(a.last || ''));
  else if (by === 'n') learned.sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  const row = f => {
    const li = document.createElement('li');
    li.className = fixKey(f) === fixChosen ? 'sel' : '';
    const b = document.createElement('b');
    b.textContent = f.name;
    const chip = document.createElement('span');
    chip.className = 'kindchip ' + (f.kind === 'learned' ? 'learned' : '');
    chip.textContent = f.kind === 'learned' ? 'learned' : f.kind;
    li.append(b, chip);
    fixLines(f).forEach((l, i) => { const s = document.createElement('small'); s.textContent = l; if (i === 0) s.className = 'lastpos'; li.append(s); });
    li.onclick = () => showFix(f);
    return li;
  };
  const items = learned.map(row);
  if (db.length) {
    const sep = document.createElement('li');
    sep.className = 'sep';
    sep.textContent = `Navigation database${fixData.more ? ' (first ' + db.length + ')' : ''}`;
    items.push(sep, ...db.map(row));
  }
  if (!items.length) {
    const e = document.createElement('li');
    e.className = 'sep';
    e.textContent = $('#fixq').value.trim() ? 'No fix by that name.' : 'No fix has been learned yet.';
    items.push(e);
  }
  ul.replaceChildren(...items);
  if (fixData) {
    const nav = fixData.database_names ? `navigation database: ${fixData.database_names.toLocaleString()} names${fixData.database_cycle ? ', cycle ' + fixData.database_cycle : ''}`
                                       : 'no navigation database loaded';
    $('#fixstat').textContent = `${fixData.learned_names} fixes learned from messages (${fixData.learned_positions} positions) · ${nav}`;
  }
}

async function loadFixes() {
  const seq = ++fixSeq;
  try {
    const d = await api('/api/fixes?q=' + encodeURIComponent($('#fixq').value.trim()));
    if (seq !== fixSeq || !d) return;   // a newer search is under way
    fixData = d;
    $('#fixerr').textContent = '';
    renderFixes();
  } catch (e) { $('#fixerr').textContent = e.message; }
}

// Every learned fix as a small dot, if asked for; clicking one finds it in the list.
async function drawAllFixes() {
  fixAllGroup.clearLayers();
  if (!$('#fixall').checked) return;
  try {
    const d = await api('/api/fixes');
    if (!d || !$('#fixall').checked) return;
    for (const f of d.fixes) {
      const dot = L.circleMarker(ll2(f), {radius: 4, color: '#fff', weight: 1, fillColor: '#c2255c', fillOpacity: .85});
      dot.bindTooltip(fixTip(f));
      dot.on('click', () => { $('#fixq').value = f.name; loadFixes().then(() => showFix(f)); });
      dot.addTo(fixAllGroup);
    }
  } catch (e) { $('#fixerr').textContent = e.message; }
}

// ---- airport search -------------------------------------------------------------------------
// Airports by code, name or city (the server ranks them); with nothing typed, the ones your watches use.
// The one chosen is drawn with the 15 nm circle inside which a low, slow, silent aircraft is taken to have landed.
const airportGroup = L.layerGroup().addTo(map);
let airportData = null, airportChosen = null, airportTimer = null, airportSeq = 0;
const LANDING_RADIUS_NM = 15;
const airportCodes = a => a.icao + (a.iata ? ' / ' + a.iata : '');

function airportLines(a) {
  const lines = [[a.name, a.city && !a.name.includes(a.city) ? a.city : ''].filter(Boolean).join(' · ')];
  lines.push(`${coord(a)}${a.elev_ft != null ? ' · ' + num(a.elev_ft) + ' ft' : ''}`);
  for (const w of a.why || []) lines.push(w);
  return lines;
}

function airportTip(a) {
  const d = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = airportCodes(a);
  d.append(b);
  for (const l of airportLines(a)) { const e = document.createElement('div'); e.textContent = l; d.append(e); }
  return d;
}

function showAirport(a) {
  airportChosen = a.icao;
  airportGroup.clearLayers();
  const at = ll2(a);
  L.circle(at, {radius: LANDING_RADIUS_NM * 1852, color: '#1d4ed8', weight: 1, dashArray: '4 6', fillOpacity: .04, interactive: false}).addTo(airportGroup);
  L.circleMarker(at, {radius: 7, color: '#fff', weight: 2, fillColor: '#1d4ed8', fillOpacity: 1}).addTo(airportGroup)
    .bindTooltip(airportTip(a), {permanent: true, direction: 'right', offset: [10, 0]});
  map.setView(at, Math.max(map.getZoom ? map.getZoom() : 0, 10));
  renderAirports();
}

function renderAirports() {
  const all = airportData ? airportData.airports : [];
  const items = all.map(a => {
    const li = document.createElement('li');
    li.className = a.icao === airportChosen ? 'sel' : '';
    const b = document.createElement('b');
    b.textContent = airportCodes(a);
    li.append(b);
    airportLines(a).forEach((l, i) => { const s = document.createElement('small'); s.textContent = l; if (i === 0) s.className = 'lastpos'; li.append(s); });
    li.onclick = () => showAirport(a);
    return li;
  });
  if (!items.length) {
    const e = document.createElement('li');
    e.className = 'sep';
    e.textContent = $('#aptq').value.trim() ? 'No airport matches.' : 'Type a code, name or city. (None of your watches use an airport yet.)';
    items.push(e);
  } else if (airportData.more) {
    const e = document.createElement('li');
    e.className = 'sep';
    e.textContent = `The first ${all.length}: type more to narrow it down.`;
    items.push(e);
  }
  $('#aptlist').replaceChildren(...items);
  if (airportData) {
    $('#aptstat').textContent = airportData.watched
      ? `Airports your watches use · ${airportData.total.toLocaleString()} airports to search`
      : `${all.length}${airportData.more ? '+' : ''} match${all.length === 1 ? '' : 'es'} of ${airportData.total.toLocaleString()} airports`;
  }
}

async function loadAirports() {
  const seq = ++airportSeq;
  try {
    const d = await api('/api/airports?q=' + encodeURIComponent($('#aptq').value.trim()));
    if (seq !== airportSeq || !d) return;   // a newer search is under way
    airportData = d;
    $('#apterr').textContent = '';
    renderAirports();
  } catch (e) { $('#apterr').textContent = e.message; }
}
$('#aptq').oninput = () => { clearTimeout(airportTimer); airportTimer = setTimeout(loadAirports, 200); };
$('#aptq').onkeydown = e => {   // Enter goes to the first match
  if (e.key === 'Enter' && airportData && airportData.airports.length) { e.preventDefault(); showAirport(airportData.airports[0]); }
};

// What a search tab put on the map goes when it is left, or when a target is chosen: the airport's circle, the chosen
// fix and the "all on the map" dots.
function clearAirport() {
  airportGroup.clearLayers();
  airportChosen = null;
  if (airportData) renderAirports();
}
function clearFixes() {
  fixGroup.clearLayers();
  fixAllGroup.clearLayers();
  fixChosen = null;
  $('#fixall').checked = false;
  if (fixData) renderFixes();
}

function showTab(name) {
  for (const t of ['watch', 'fixes', 'airports']) {
    $('#tab-' + t).hidden = name !== t;
    $('#tab' + t).classList.toggle('on', name === t);
  }
  if (name !== 'airports') clearAirport();
  if (name !== 'fixes') clearFixes();
  if (name === 'fixes') { loadFixes(); drawAllFixes(); }
  if (name === 'airports') loadAirports();
}
$('#tabwatch').onclick = () => showTab('watch');
$('#tabfixes').onclick = () => showTab('fixes');
$('#tabairports').onclick = () => showTab('airports');
$('#fixq').oninput = () => { clearTimeout(fixTimer); fixTimer = setTimeout(loadFixes, 200); };
$('#fixq').onkeydown = e => {   // Enter goes to the first match
  if (e.key === 'Enter' && fixData && fixData.fixes.length) { e.preventDefault(); showFix(fixData.fixes[0]); }
};
$('#fixsort').onchange = renderFixes;
$('#fixall').onchange = drawAllFixes;

function tick() { $('#clock').textContent = new Date().toISOString().slice(0, 19).replace('T', ' ') + 'Z'; }
tick();
setInterval(tick, 1000);

refresh();
// Every 30 s: update the list and redraw the selected aircraft, leaving the map view,
// the highlight and any open message details alone.
setInterval(async () => {
  try {
    await refresh();
    const w = watches.find(x => x.id === selected);
    if (w) await showTrack(w, false);
  } catch (e) { /* transient: try again next tick */ }
}, 30000);
</script>
</body>
</html>
