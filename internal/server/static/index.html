<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullFlight</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="notes.css">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { padding: 12px 12px 0; overflow: hidden; border-right: 1px solid #ccc; display: flex; flex-direction: column; min-height: 0; }
  /* The Watches tab is two folding sections that share the height: the targets above, the messages below, each
     scrolling on its own, so the messages never sit under a long list of targets. */
  #tab-watch { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; }
  #tab-watch[hidden] { display: none; }
  #tab-fixes, #tab-airports { flex: 1 1 0; min-height: 0; overflow: auto; }
  .acc { display: flex; flex-direction: column; min-height: 0; border-top: 1px solid #d5dbe6; }
  .acc.open { flex: 1 1 0; }
  #acc-targets.open { flex: 0 1 auto; max-height: 45%; }
  #tab-watch.msgs-closed #acc-targets.open { flex: 1 1 0; max-height: none; }
  .acchead { display: flex; align-items: center; gap: 6px; width: 100%; margin: 0; padding: 6px 4px; border: none; background: #f1f4f9; cursor: pointer;
             font: 600 13px system-ui, sans-serif; text-align: left; color: #1d3557; flex: none; }
  .acchead:hover { background: #e6ebf4; }
  .acchead .chev { width: 1em; display: inline-block; }
  .acchead .count, .acchead .accsel { font-weight: normal; color: #666; }
  .acchead .accsel { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .accbody { overflow: auto; min-height: 0; flex: 1 1 auto; padding: 6px 4px 8px; }
  .acccontrols { flex: none; padding: 4px 4px 0; }
  .info { color: #667; cursor: help; align-self: center; font-size: 15px; }
  .acc:not(.open) .accbody, .acc:not(.open) .acccontrols { display: none; }
  #map { height: 100%; }
  .lg { display: inline-flex; align-items: center; vertical-align: middle; margin-right: 3px; }
  .lg i { display: inline-block; box-sizing: content-box; }
  .lg .st { width: 8px; height: 0; border-top: var(--w, 2px) solid currentColor; }
  .lg .dot { width: 5px; height: 5px; border-radius: 50%; border: 1.5px solid currentColor; background: currentColor; }
  .lg .dot.hollow { background: #fff; }
  body.bysource .lg .st { border-top-style: var(--dash, solid); }   /* the by-source view draws each source in its own dash */
  form { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  input[name=input] { flex: 1 1 100%; padding: 6px; }
  input[name=until] { flex: 1; padding: 6px; }
  .hint { color: #666; font-size: 12px; margin: 0 0 12px; }
  #err { color: #b00; }
  #err:empty, #note:empty { display: none; }   /* only take room when there is something to say */
  #acc-targets .acccontrols form { margin-bottom: 2px; }
  #acc-targets .accbody { padding-top: 2px; }
  #note.hint { margin: 2px 0 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
  li.sel { background: #eef4ff; }
  li small { color: #666; display: block; }
  li small.lastpos { color: #333; }
  li small.route, li small.flight { color: #333; }
  li small.adsbpoll { color: #666; }
  li small.adsbpoll.bad { color: #b45309; }
  li small.route.stale, li small.flight.stale { color: #999; font-style: italic; }
  .waiting { color: #a60; } .tracking { color: #070; } .done, .expired { color: #888; } .paused { color: #888; font-style: italic; }
  button.del { float: right; }
  button.pause { float: right; margin-right: 4px; font-size: 11px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 3px; padding: 0 6px; }
  button.pause:hover { background: #f0f0f0; }
  button.pause.suggest { border-color: #2b8a3e; color: #2b8a3e; font-weight: 600; }
  button.pause[hidden] { display: none; }
  button.copy { border: none; background: none; cursor: pointer; padding: 0 3px; font-size: 11px; vertical-align: baseline; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 13px; z-index: 5000; pointer-events: none; }
  button.copy:hover { background: #e8eefc; border-radius: 3px; }
  h4 { margin: 14px 0 4px; }
  #msgs .msg { padding: 5px 4px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; }
  #msgs .msg time { color: #666; font-family: ui-monospace, monospace; margin-right: 6px; }
  #msgs time.rt { border-bottom: 1px dotted #888; cursor: help; }
  #msgs .kind { background: #eef; border-radius: 3px; padding: 0 4px; margin-right: 4px; font-size: 11px; }
  #msgs .warn { color: #b60; cursor: help; margin-left: 4px; }
  #msgs pre { white-space: pre-wrap; word-break: break-all; background: #f6f6f6; padding: 6px; margin: 4px 0 0; font-size: 11px; }
  #msgs .empty { color: #888; padding: 4px; }
  #msgs .msg { overflow-wrap: anywhere; }
  #msgs .msg.sel { background: #fff3bf; }
  #msgs .msg.hasloc { border-left: 3px solid #d60; }
  .plane { background: none; border: none; }
  #menubtn { float: right; border: 1px solid transparent; background: none; font-size: 18px; line-height: 1; padding: 2px 6px; cursor: pointer; color: #1d3557; border-radius: 3px; }
  #menubtn:hover, #menubtn.on { background: #f1f4f9; border-color: #ccd; }
  #menu { position: absolute; right: 12px; top: 40px; z-index: 1200; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.2); min-width: 180px; }
  #menu a { display: block; padding: 8px 12px; color: #222; text-decoration: none; }
  #menu a:hover { background: #eef4ff; }
  .notebtn { float: right; border: none; background: none; cursor: pointer; font-size: 12px; padding: 0 4px; }
  .notebtn.empty { opacity: .35; }
  .notebtn:hover { opacity: 1; }
  .notebtn[hidden] { display: none; }
  .kindchip { font-weight: normal; font-size: 10px; margin-left: 5px; padding: 0 4px; border-radius: 3px; background: #e8eefc; color: #345; }
  .fhead { margin: 8px 0 2px; padding: 3px 5px; background: #eef2f7; border-left: 3px solid #1d3557; font-size: 12px; cursor: pointer; }
  .fhead.none { background: none; border-left-color: #bbb; color: #888; cursor: default; }
  /* Leaflet keeps a tooltip on one line; a long line (where a landed aircraft says how it was inferred) wraps instead */
  .leaflet-tooltip { white-space: normal; width: max-content; max-width: 340px; overflow-wrap: break-word; }
  .fflag-wrap { background: none; border: none; }
  .fflag { background: #1d3557; color: #fff; font: 11px system-ui, sans-serif; padding: 1px 5px; border-radius: 3px; white-space: nowrap; cursor: pointer; }
  /* A label held away from its point (see callout()): centred on where it was put, and draggable */
  .callout-wrap { background: none; border: none; }
  .callout { position: absolute; transform: translate(-50%, -50%); box-shadow: 0 1px 4px rgba(0,0,0,.45); cursor: grab; user-select: none; }
  .callout:active { cursor: grabbing; }
  .callout.box { background: #fff; color: #111; border: 1px solid #888; border-radius: 4px; padding: 3px 6px; font: 12px system-ui, sans-serif; width: max-content; max-width: 260px; white-space: normal; overflow-wrap: break-word; }
  .callout.atis { border-color: #7c3aed; }
  .partchip { font-size: 10px; color: #555; background: #eceff3; border-radius: 8px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
  .msg.elsewhere { opacity: .55; }
  .elsechip { margin-left: 6px; font-size: 11px; color: #92400e; background: #fef3c7; border-radius: 3px; padding: 0 4px; cursor: help; white-space: nowrap; }
  .atis-dot-wrap { background: none; border: none; }
  .atis-dot { width: 6px; height: 6px; margin: 4px; transform: rotate(45deg); background: #7c3aed; cursor: pointer; }   /* the 14 px box around it is what is clicked */
  .fflag.latest { background: #c00; }
  .wpt-wrap { background: none; border: none; }
  .wpt { width: 8px; height: 8px; margin: 3px; transform: rotate(45deg); background: #fff; border: 2px solid #1d3557; box-sizing: content-box; }
  .wpt.est { border-style: dashed; border-color: #6b7a8f; background: transparent; opacity: .9; }
  #tabs { display: flex; gap: 2px; margin: 0 0 10px; border-bottom: 1px solid #ccc; }
  #tabs button { border: none; background: none; padding: 5px 12px; cursor: pointer; font: inherit; color: #555; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  #tabs button.on { color: #1d3557; border-bottom-color: #1d3557; font-weight: 600; }
  #fixq, #aptq { width: 100%; box-sizing: border-box; padding: 6px; }
  #fixlist li, #aptlist li { padding: 6px 8px; }
  #fixlist li b, #aptlist li b { font-family: ui-monospace, monospace; }
  #fixlist li small, #aptlist li small { color: #555; }
  #fixlist li small.dim { color: #999; }
  #fixlist li .kindchip.learned { background: #fde4ee; color: #8a1c46; }
  /* fixed, placed from the box's position by placeSuggestions(): the sidebar clips anything that overflows it */
  .aptpick { position: fixed; z-index: 1100; min-width: 300px; max-width: min(420px, 92vw); max-height: 260px; overflow: auto; margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid #aaa; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .aptpick li { padding: 6px 8px; cursor: pointer; }
  .aptpick li b { font-family: ui-monospace, monospace; }
  .aptpick li small { display: block; color: #555; }
  .aptpick li.sel, .aptpick li:hover { background: #e6efff; }
  #fixlist .sep, #aptlist .sep { cursor: default; color: #666; font-size: 12px; background: #f6f6f6; }
  .fixpin-wrap { background: none; border: none; }
  .fixpin { width: 10px; height: 10px; margin: 3px; transform: rotate(45deg); box-sizing: content-box; }
  .fixpin.learned { background: #c2255c; border: 2px solid #fff; box-shadow: 0 0 0 2px #c2255c; }
  .fixpin.db { background: #fff; border: 2px solid #6c757d; }
  .windbarb-wrap { background: none; border: none; }
  .agebadge { position: absolute; left: 50%; top: 27px; transform: translateX(-50%); font: 10px/12px system-ui, sans-serif; padding: 0 3px;
              border-radius: 3px; background: rgba(255,255,255,.92); border: 1px solid #bbb; color: #555; white-space: nowrap; pointer-events: none; }
  .agebadge.s2 { color: #d9480f; border-color: #d9480f; }
  .agebadge.s3 { color: #8a5a12; border-color: #a8793a; }
  .agebadge.s5 { color: #2b8a3e; border-color: #2b8a3e; font-weight: 600; }
  .agebadge.s4 { color: #555; border: 1px dashed #868e96; font-style: italic; }
  .agering { position: absolute; left: -3px; top: -3px; width: 30px; height: 30px; border: 2px dashed #868e96; border-radius: 50%; pointer-events: none; }
  .plane svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  #wxbadges { position: fixed; top: 40px; right: 8px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; pointer-events: none; }
  .wxbadge { padding: 2px 8px; border-radius: 4px; font: 12px system-ui, sans-serif; background: rgba(255,255,255,.9); border: 1px solid #aaa; color: #345; }
  .wxbadge[hidden] { display: none; }
  #clock { position: fixed; top: 8px; right: 8px; z-index: 1000; padding: 3px 8px; border-radius: 4px;
           background: rgba(255,255,255,.9); border: 1px solid #aaa; font: 13px ui-monospace, monospace; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 50vh; height: auto; }
    aside { display: block; overflow: visible; }
    #tab-watch { display: block; }
    .acc.open, #acc-targets.open { max-height: none; }
    .accbody { overflow: visible; }
  }
</style>
</head>
<body>
<aside style="position:relative">
  <h3 style="margin-top:0">FullFlight
    <button id="menubtn" type="button" title="Menu" aria-label="Menu" aria-haspopup="true">&#9776;</button></h3>
  <div id="menu" hidden><a id="menu-airframes" href="/airframes.html" title="Every aircraft we know of, with your notes">Airframes</a><a id="menu-stations" href="/stations.html" title="The receiving stations our messages came through: where they are, and how late they deliver">Stations</a><a id="menu-backfill" href="/backfill.html" title="Fill in an aircraft's track from before we followed it, from adsb.lol's daily archives">Backfill history&hellip;</a></div>
  <div id="tabs"><button id="tabwatch" class="on">Watches</button><button id="tabfixes" title="Search the waypoints we know">Fixes</button><button id="tabairports" title="Search airports">Airports</button></div>
  <div id="tab-watch">
  <section class="acc open" id="acc-targets">
  <button class="acchead" id="acchead-targets" title="Fold the list of targets away"><span class="chev" id="chev-targets">&#9662;</span> Targets <span class="count" id="targetcount"></span><span class="accsel" id="targetsel"></span></button>
  <div class="acccontrols">
  <form id="add">
    <input name="input" placeholder="UA869 2026-10-31 [SFO]   or   CPA113   or   B-LRM   or   780AB8" required autocomplete="off">
    <input name="until" type="datetime-local" title="Optional end (tail/hex only; default 36 h)">
    <button>Watch</button>
    <span class="info" title="Flight + date waits for takeoff; an optional destination (its 4-letter ICAO code, e.g. KDEN; the IATA code works too) ends the watch on arrival there instead of after a long ground stop. A tail or hex tracks now until the end time (default 36 h).">&#9432;</span>
  </form>
  <div id="err"></div>
  <div id="note" class="hint"></div>
  </div>
  <div class="accbody">
  <ul id="list"></ul>
  </div>
  </section>
  <section class="acc open" id="acc-msgs">
  <button class="acchead" id="acchead-msgs" title="Fold the messages away"><span class="chev" id="chev-msgs">&#9662;</span> Messages <span class="count" id="msgcount"></span></button>
  <div class="acccontrols">
  <p class="hint" style="margin:8px 0 0"><label>Flights: <select id="flightsel" style="max-width:100%"><option value="recent">no flights identified yet</option></select></label></p>
  <p class="hint" id="joinedit" style="margin:4px 0 0" hidden>
    <button type="button" id="joinbtn" title="">Join with previous flight</button>
    <button type="button" id="splitbtn" title="Take the join made by hand away: this goes back to being separate flights">Split the joined flights</button>
    <span id="joinmsg" style="color:#b00"></span>
  </p>
  <p class="hint" id="explainedit" style="margin:4px 0 0" hidden>
    <a id="explainlink" href="/explain.html" target="_blank" rel="noopener" title="Opens a page saying what the flight logic did to divide this aircraft's history into flights, and why">Why are the flights this way?</a>
  </p>
  <p class="hint" id="routeedit" style="margin:4px 0 0" hidden>
    <button type="button" id="routebtn" title="This flight's messages did not say where it went. Enter the origin and destination yourself; anything the messages do say wins.">Set route</button>
    <span id="routeform" hidden>
      <label>From <input id="routefrom" size="5" maxlength="4" autocomplete="off" placeholder="ICAO"></label>
      <label>To <input id="routeto" size="5" maxlength="4" autocomplete="off" placeholder="ICAO"></label>
      <button type="button" id="routesave">Save</button>
      <button type="button" id="routeclear" title="Forget what you entered for this flight">Clear</button>
      <button type="button" id="routecancel">Cancel</button>
    </span>
    <span id="routenote" hidden></span>
    <span id="routemsg" style="color:#b00"></span>
    <ul id="routeapts" class="aptpick" hidden></ul>
  </p>
  <p class="hint" style="margin:8px 0 0"><label>Projection: look ahead
    <select id="ahead"><option value="0">off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></label>
    <span title="Dead reckoning from the newest fix. Never from a fix over an hour old, never more than 90 minutes from the fix, never past a known destination. As its newest fix ages the plane fades and shows the age of the fix; at an hour old it is ringed and no estimate is drawn.">ⓘ</span></p>
  </div>
  <div class="accbody">
  <div id="msgs"><div class="empty">Select a watch that has an aircraft.</div></div>
  </div>
  </section>
  </div>
  <div id="tab-fixes" hidden>
    <input id="fixq" placeholder="Fix name, e.g. WEDES" autocomplete="off" spellcheck="false">
    <p class="hint" id="fixstat" style="margin:6px 0 4px"></p>
    <p class="hint" style="margin:0 0 6px">
      <label>Sort <select id="fixsort"><option value="name">name</option><option value="last">last confirmed</option><option value="n">most messages</option></select></label>
      <label style="margin-left:8px"><input type="checkbox" id="fixall"> all on the map</label></p>
    <div id="fixerr" style="color:#b00"></div>
    <ul id="fixlist"></ul>
  </div>
  <div id="tab-airports" hidden>
    <input id="aptq" placeholder="Airport code, name or city, e.g. NRT or Narita" autocomplete="off" spellcheck="false">
    <p class="hint" id="aptstat" style="margin:6px 0 4px"></p>
    <div id="apterr" style="color:#b00"></div>
    <ul id="aptlist"></ul>
  </div>
</aside>
<div id="map"></div>
<div id="clock" title="Current time, UTC"></div>
<div id="wxbadges">
  <div class="wxbadge" id="radarbadge" hidden title="The newest frame of the radar composite on the map. It is refreshed every 5 minutes."></div>
  <div class="wxbadge" id="satbadge" hidden title="The newest infrared satellite frames on the map, from the satellites that see each part of the world. Refreshed every 10 minutes."></div>
</div>
<div id="notespanel" hidden>
  <div class="nphead"><b id="notestitle"></b><button id="notesclose" title="Close">&#10005;</button></div>
  <div id="notesbody"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="notes.js"></script>
<script>
const map = L.map('map').setView([30, -40], 3);
L.tileLayer('/tiles/osm/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap'}).addTo(map);
// A hover popup sits a little way from its point instead of touching it, so the point and the track around it stay in view.
if (L.Tooltip && L.Tooltip.mergeOptions) L.Tooltip.mergeOptions({offset: [16, 0]});
const layer = L.layerGroup().addTo(map);      // track, message positions, route: redrawn on refresh
const highlight = L.layerGroup().addTo(map);  // ring around the selected message's position

// One layer per position source, so each track can be switched on and off from the legend.
// gapMin: a silence longer than this ends a track rather than being bridged by a straight line.
const SOURCES = {
  adsb:         {name: 'ADS-B', color: '#0b66d0', dash: null,         weight: 3, gapMin: 20},
  adsc:         {name: 'ADS-C', color: '#e8590c', dash: null,         weight: 2, gapMin: 90},
  cpdlc:        {name: 'CPDLC', color: '#7b2cbf', dash: '10 4 2 4',   weight: 2, gapMin: 150},
  miam:         {name: 'REP081', color: '#0a9396', dash: '8 4',       weight: 2, gapMin: 90},
  fms_position: {name: 'FMS',   color: '#2b9348', dash: '2 5',        weight: 2, gapMin: 60},
  acmf_report:  {name: 'ACMF',  color: '#c2255c', dash: '6 3 1 3',    weight: 2, gapMin: 40},
  aoc_position: {name: 'AOC',   color: '#e8590c', dash: '4 4 1 4',    weight: 2, gapMin: 90},
  pos_report:   {name: 'POS',   color: '#7048e8', dash: '5 3 1 3',    weight: 2, gapMin: 40},
  posrpt:       {name: 'POSRPT', color: '#364fc7', dash: '6 2 1 2',    weight: 2, gapMin: 60},
  posa1:        {name: 'POSA1', color: '#d9480f', dash: '3 3 1 3',    weight: 2, gapMin: 60},
  sbpos:        {name: 'SB',    color: '#087f5b', dash: '7 3 1 3',    weight: 2, gapMin: 60},
  ops_report:   {name: 'Airline', color: '#a16207', dash: '4 2 1 2',   weight: 2, gapMin: 60},
  lookup:       {name: 'AeroDataBox', color: '#6c757d', dash: '1 6', weight: 2, gapMin: 180},
};
for (const src of Object.values(SOURCES)) src.group = L.layerGroup().addTo(map);
// A legend glyph: the report's dot with the line running out of each side, as the unified track draws it. (The by-source
// view dashes the stubs to match that source's line.)
const cssDash = d => !d ? 'solid' : d.split(' ')[0] <= 2 && d.split(' ').length === 2 ? 'dotted' : 'dashed';
const legendGlyph = (src, hollow) => `<span class="lg" style="color:${src.color};--w:${src.weight}px;--dash:${cssDash(src.dash)}"><i class="st"></i><i class="dot${hollow ? ' hollow' : ''}"></i><i class="st"></i></span>`;
// How the tracks are drawn: one line through every plausible report ("unified"), or a line per source. The two radio
// buttons at the top of the legend are layers only so that the layers control gives them radio buttons.
const TRACK_MODES = {unified: 'Unified track', source: 'Track by source'};
let trackMode = 'unified';
try { const v = localStorage.getItem('trackMode'); if (v in TRACK_MODES) trackMode = v; } catch (e) { /* no storage: keep the default */ }
const modeGroups = Object.fromEntries(Object.keys(TRACK_MODES).map(k => [k, L.layerGroup()]));
modeGroups[trackMode].addTo(map);
document.body.classList.toggle('bysource', trackMode === 'source');
L.control.layers(Object.fromEntries(Object.entries(TRACK_MODES).map(([k, name]) => [name, modeGroups[k]])),
  Object.fromEntries(Object.entries(SOURCES).map(([key, src]) => [`${legendGlyph(src, key === 'adsb' || key === 'lookup')} ${src.name}`, src.group])),
  {collapsed: false, position: 'bottomleft'}).addTo(map);
const wptGroup = L.layerGroup().addTo(map);   // waypoints named in CPDLC position reports
const projGroup = L.layerGroup().addTo(map);  // dead-reckoned position and look-ahead
const predGroup = L.layerGroup().addTo(map);  // what the selected report predicted: its route and next waypoints
const clearanceGroup = L.layerGroup().addTo(map);  // an oceanic clearance: the route over the ocean the centre cleared it to fly
const planGroup = L.layerGroup().addTo(map);  // the filed flight plan: planned route and its fixes
const trackGroup = L.layerGroup().addTo(map);   // the unified track: one line through every plausible report
let trackCtx = null, srcLines = [];   // what the lines are drawn from (so they can be redrawn), and the by-source lines in their groups
const bridgeGroup = L.layerGroup().addTo(map);  // estimated path across a silence between two fixes
const atisGroup = L.layerGroup().addTo(map);    // a diamond on the track where a D-ATIS request was sent
const windGroup = L.layerGroup().addTo(map);    // a wind barb on every report that gives wind direction and speed
// ---- weather radar -------------------------------------------------------------------------------------
// RainViewer's global radar composite (frames every 10 minutes), switched on from the legend and remembered. Its tiles
// are only made to zoom 7: closer than that Leaflet enlarges them (asking for more returns a "not supported" tile).
// Colour scheme 6 is the NEXRAD one (green to red, as radar is usually read). The newest frame is fetched when it is
// switched on and every 5 minutes after.
const RADAR = {index: 'https://api.rainviewer.com/public/weather-maps.json', refreshMs: 5 * 60000, scheme: 6};
const BLANK_TILE = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const radarLayer = L.tileLayer(BLANK_TILE, {opacity: .65, maxNativeZoom: 7, maxZoom: 18, zIndex: 5,
  attribution: 'Radar &copy; <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a>'});
let radarTimer = null, radarFrameMs = null, radarFailed = false;
async function loadRadar() {
  try {
    const r = await fetch(RADAR.index);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const past = (j.radar && j.radar.past) || [];
    const f = past[past.length - 1];
    if (!f) throw new Error('no frames');
    radarLayer.setUrl(`${j.host}${f.path}/256/{z}/{x}/{y}/${RADAR.scheme}/1_1.png`);
    radarFrameMs = f.time * 1000;
    radarFailed = false;
  } catch (e) { radarFailed = true; }
  showRadarBadge();
}
function showRadarBadge() {
  const b = $('#radarbadge');
  const on = map.hasLayer(radarLayer);
  b.hidden = !on;
  if (!on) return;
  b.textContent = radarFrameMs && !radarFailed ? `Weather radar \u00b7 ${fmtTime(radarFrameMs).slice(0, 5)}Z (${ago(radarFrameMs)})`
                                              : radarFailed ? 'Weather radar unavailable' : 'Weather radar\u2026';
}
radarLayer.on('add', () => {
  loadRadar();
  radarTimer = setInterval(loadRadar, RADAR.refreshMs);
  try { localStorage.setItem('radar', '1'); } catch (e) { /* not saved: fine */ }
});
radarLayer.on('remove', () => {
  clearInterval(radarTimer);
  radarFrameMs = null;
  showRadarBadge();
  try { localStorage.setItem('radar', '0'); } catch (e) { /* not saved: fine */ }
});

// ---- infrared satellite --------------------------------------------------------------------------------
// Where there is no ground radar (most of the oceans) storms show up in the infrared: the colder the cloud top the taller
// the cloud, and NASA GIBS serves the three geostationary satellites' band-13 imagery, 10 minutes apart and about half an
// hour behind, coloured so that cold cloud tops stand out (blue to red) on the grey cloud. Himawari sees East Asia, Australia
// and the western Pacific, GOES-West the eastern Pacific and Hawaii, GOES-East the Americas and the Atlantic; nothing here
// covers Europe, Africa or the Indian Ocean. A tile has to be asked for by time, so the newest frame of each is found by
// trying back from now (a loaded image is the test: no CORS needed). Infrared sees cloud tops, not rain, so cold high
// cirrus can look like a storm and heavy rain from low cloud can be missed.
//
// The three views overlap, and imagery near a satellite's edge is stretched into streaks, so each satellite draws only the
// longitudes it sees well (lonRange, degrees east, from the first to the second, wrapping the date line if the first is the
// larger): Himawari from 60E to the date line, GOES-West from there to 105W, GOES-East from there to 6E. A tile belongs to
// the range its centre is in.
//
// GIBS frames have holes: a tile can be missing from one frame and present in the one before. So a tile that is not there
// is asked for again from the frame before, and the one before that, before it is given up on.
const RegionTiles = L.TileLayer.extend({
  frameMs: null,   // the newest frame; set when it has been found, then redraw()
  createTile(coords, done) {
    const tile = document.createElement('img');
    tile.alt = '';
    const lon = ((((coords.x + .5) / 2 ** coords.z) * 360 - 180 + 540) % 360) - 180;
    const [a, b] = this.options.lonRange;
    const mine = a <= b ? lon >= a && lon < b : lon >= a || lon < b;
    if (!mine || !this.frameMs) {            // not this satellite's part of the world, or no frame yet
      setTimeout(() => done(null, tile), 0);
      return tile;
    }
    const tryFrame = k => {
      if (k > SAT.olderFrames) { tile.removeAttribute('src'); tile.style.visibility = 'hidden'; done(null, tile); return; }
      tile.onload = () => done(null, tile);
      tile.onerror = () => tryFrame(k + 1);
      tile.src = this.options.urlFor(coords, this.frameMs - k * SAT.stepMin * 60000);
    };
    tryFrame(0);
    return tile;
  },
});
const SAT = {
  base: 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best', stepMin: 10, startBackMin: 20, maxBackMin: 150, olderFrames: 2, refreshMs: 10 * 60000,
  attribution: 'Satellite imagery: <a href="https://earthdata.nasa.gov/gibs" target="_blank" rel="noopener">NASA GIBS</a> (JMA Himawari, NOAA GOES)',
  // probe: a tile inside the satellite's view (zoom/row/column), for finding its newest frame
  birds: [
    {name: 'Himawari', layer: 'Himawari_AHI_Band13_Clean_Infrared', probe: '3/3/7', lonRange: [60, 180]},
    {name: 'GOES-West', layer: 'GOES-West_ABI_Band13_Clean_Infrared', probe: '3/3/1', lonRange: [-180, -105]},
    {name: 'GOES-East', layer: 'GOES-East_ABI_Band13_Clean_Infrared', probe: '3/3/1', lonRange: [-105, 6]},
  ],
};
for (const b of SAT.birds) {
  b.tiles = new RegionTiles(BLANK_TILE, {opacity: .55, maxNativeZoom: 6, maxZoom: 18, zIndex: 4, attribution: SAT.attribution, lonRange: b.lonRange,
    urlFor: (coords, ms) => tileUrl(b, ms, `${coords.z}/${coords.y}/${coords.x}`)});
  b.frameMs = null;
}
const satGroup = L.layerGroup(SAT.birds.map(b => b.tiles));
let satTimer = null, satSeq = 0, satTried = false;
const gibsTime = ms => new Date(ms).toISOString().slice(0, 19) + 'Z';
const tileUrl = (bird, ms, tile) => `${SAT.base}/${bird.layer}/default/${gibsTime(ms)}/GoogleMapsCompatible_Level6/${tile}.png`;
const imageLoads = url => new Promise(done => { const i = new Image(); i.onload = () => done(true); i.onerror = () => done(false); i.src = url; });
// The newest frame that exists: tried from a little way back, at the satellite's 10 minute steps.
async function newestFrame(bird) {
  const step = SAT.stepMin * 60000, now = Date.now();
  for (let t = Math.floor((now - SAT.startBackMin * 60000) / step) * step; t > now - SAT.maxBackMin * 60000; t -= step) {
    if (await imageLoads(tileUrl(bird, t, bird.probe))) return t;
  }
  return null;
}
async function loadSatellite() {
  const seq = ++satSeq;
  await Promise.all(SAT.birds.map(async b => {
    const t = await newestFrame(b);
    if (seq !== satSeq || !map.hasLayer(satGroup)) return;   // switched off, or a newer load is under way
    if (t && t !== b.frameMs) { b.frameMs = b.tiles.frameMs = t; b.tiles.redraw(); }
  }));
  satTried = true;
  showSatBadge();
}
function showSatBadge() {
  const b = $('#satbadge');
  const on = map.hasLayer(satGroup);
  b.hidden = !on;
  if (!on) return;
  const have = SAT.birds.filter(x => x.frameMs);
  if (!have.length) { b.textContent = satTried ? 'Satellite IR unavailable' : 'Satellite IR\u2026'; return; }
  const times = have.map(x => x.frameMs), oldest = Math.min(...times), newest = Math.max(...times);
  const hhmm = ms => fmtTime(ms).slice(0, 5);
  b.textContent = `Satellite IR \u00b7 ${oldest === newest ? hhmm(oldest) : hhmm(oldest) + '\u2013' + hhmm(newest)}Z (${ago(oldest)})`;
}
satGroup.on('add', () => {
  loadSatellite();
  satTimer = setInterval(loadSatellite, SAT.refreshMs);
  try { localStorage.setItem('sat', '1'); } catch (e) { /* not saved: fine */ }
});
satGroup.on('remove', () => {
  clearInterval(satTimer);
  ++satSeq;
  SAT.birds.forEach(b => { b.frameMs = b.tiles.frameMs = null; });
  satTried = false;
  showSatBadge();
  try { localStorage.setItem('sat', '0'); } catch (e) { /* not saved: fine */ }
});

L.control.layers(null, {
  '<span style="font-weight:bold">&#9638;</span> Weather radar': radarLayer,
  '<span style="font-weight:bold">&#9729;</span> Satellite (IR)': satGroup,
  '<span style="font-weight:bold">&#9671;</span> Waypoints': wptGroup,
  '<span style="color:#e8590c;font-weight:bold">&#8211; &#8211;</span> Predictions': predGroup,
  '<span style="color:#5c6b8a;font-weight:bold">&#8211; &#8211;</span> Planned route': planGroup,
  '<span style="color:#0f766e;font-weight:bold">&#8211; &#8211;</span><span style="color:#b45309;font-weight:bold">&#8211;</span> Clearances (oceanic, departure)': clearanceGroup,
  '<span style="color:#777;font-weight:bold">&middot;&middot;&middot;</span> Estimated path': bridgeGroup,
  '<span style="color:#666;font-weight:bold">&middot;&middot;&middot;</span> Projection': projGroup,
  '<span style="font-weight:bold">&#8627;</span> Wind barbs': windGroup,
  '<span style="color:#7c3aed;font-weight:bold">&#9670;</span> D-ATIS, METAR and TAF requests': atisGroup,
}, {collapsed: false, position: 'bottomleft'}).addTo(map);
// ---- longitude frame --------------------------------------------------------------------
// The map's longitude is continuous (181 is the same place as -179, drawn one world over), so near
// the date line everything must be drawn in ONE frame or a track from 179 to -179 is a line right
// round the world. Every coordinate handed to the map goes through ll(), which picks the copy of the
// longitude nearest lonRef: the longitude of the aircraft's newest fix when it was chosen. lonRef stays
// put while the aircraft flies on, so a track that crosses 180 just carries on to 181, 182, ...
let lonRef = null;
const lonU = lon => lon + 360 * Math.round(((lonRef ?? 0) - lon) / 360);
const ll = (lat, lon) => [lat, lonU(lon)];
// A track's points in that frame, cut wherever two neighbours would be over 180 degrees apart
// (the far end of a very long history, which is on the other side of the world from lonRef).
function trackParts(fixes) {
  const parts = [];
  let cur = [];
  for (const f of fixes) {
    const lon = lonU(f.lon);
    if (cur.length && Math.abs(lon - cur[cur.length - 1][1]) > 180) { parts.push(cur); cur = []; }
    cur.push([f.lat, lon]);
  }
  parts.push(cur);
  return parts.filter(part => part.length >= 2);
}
let selected = null, watches = [];
const $ = s => document.querySelector(s);
const fmt = t => new Date(t).toISOString().slice(0, 16).replace('T', ' ') + 'Z';
const fmtTime = t => new Date(t).toISOString().slice(11, 19) + 'Z';
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000));
  if (s < 90) return s + 's ago';
  if (s < 7200) return Math.round(s / 60) + 'm ago';
  if (s < 48 * 3600) return (s / 3600).toFixed(1).replace(/\.0$/, '') + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
// A time with how long ago it was, for a hover: "2026-10-30 18:48Z · 31m ago".
const fmtAgo = t => `${fmt(t)} · ${ago(t)}`;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Copy text to the clipboard. The async clipboard API only exists on secure pages (https or
// localhost), so fall back to the old select-and-copy trick when the page is served over plain http.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through to the fallback */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function copyButton(text) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'copy';
  const reset = () => { b.textContent = '\u{1F4CB}'; b.title = `Copy ${text}`; };
  reset();
  b.onclick = async e => {
    e.stopPropagation();           // do not also select the watch
    const ok = await copyText(text);
    b.textContent = ok ? '\u2713' : '!';
    b.title = ok ? 'Copied' : 'Could not copy';
    setTimeout(reset, 1200);
  };
  return b;
}

// An identifier in the watch list that a double click copies. Selecting it by hand does not last: the list is redrawn
// every few seconds and takes the selection with it.
function copyable(text) {
  const e = document.createElement('span');
  e.textContent = text;
  e.title = 'Double-click to copy';
  e.ondblclick = async ev => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const ok = await copyText(text);
    const t = document.createElement('div');   // the span may be redrawn before anyone looks, so the answer is a toast
    t.className = 'toast';
    t.textContent = ok ? `Copied ${text}` : `Could not copy ${text}`;
    document.body.append(t);
    setTimeout(() => t.remove(), 1500);
  };
  return e;
}

// What the last ADS-B ask for a watch found, so a missing track can be explained: when it was asked, whether the aircraft
// was in the answer, and when it was last heard. (The line under "last ADS-B" says when the newest position is from.)
const POLL_RESULT = {heard: '', not_seen: 'not in the answer', no_position: 'in the answer, no usable position', error: 'the ask failed'};
function pollText(w) {
  const p = w.poll;
  const hold = w.lookup_hold ? `flight lookup paused until ${fmt(w.lookup_hold.until).slice(11)}` : '';   // the provider refused us (a 429)
  if (!p) return hold;
  return [`ADS-B ${w.status === 'paused' ? 'paused, last req' : 'req'} ${ago(p.asked)}`, POLL_RESULT[p.outcome] ?? p.outcome,
    p.heard ? `heard ${ago(p.heard)}${p.source ? ' (' + p.source + ')' : ''}` : 'never heard',
    p.misses > 1 ? `${p.misses} asks without it` : '', hold].filter(Boolean).join(' \u00b7 ');
}
function pollLine(w) {
  if (!w.poll && !w.lookup_hold) return null;
  const s = document.createElement('small');
  s.className = 'adsbpoll' + (w.poll && w.poll.outcome === 'error' || w.lookup_hold ? ' bad' : '');
  s.textContent = pollText(w);
  if (!w.poll) { s.title = `Lookups of this flight by number are paused: ${w.lookup_hold.reason}`; return s; }
  s.title = [w.lookup_hold ? `The flight-number lookup is paused until ${fmt(w.lookup_hold.until)}: ${w.lookup_hold.reason}` : '', `Asked the ADS-B sources about it at ${fmt(w.poll.asked)}.`, w.poll.detail,
    w.poll.heard ? `Newest position they ever gave: ${fmt(w.poll.heard)}${w.poll.source ? ' from ' + w.poll.source : ''}.` : 'They have not given a position yet.',
    w.status === 'paused' ? 'Paused: nothing is being asked.' : ''].filter(Boolean).join('\n');
  return s;
}

async function refresh() {
  watches = await api('/api/watches');
  $('#targetcount').textContent = watches.length ? `(${watches.length})` : '';
  const chosen = watches.find(w => w.id === selected);
  $('#targetsel').textContent = chosen ? chosen.ident : '';   // shown when the list is folded away
  const ul = $('#list');
  ul.replaceChildren(...watches.map(w => {
    const li = document.createElement('li');
    li.className = w.id === selected ? 'sel' : '';
    const title = w.kind === 'flight' ? `${w.ident}${w.date ? ' ' + w.date : ''}${w.dest ? ' → ' + w.dest : ''}` : w.ident;
    // A tail or hex watch follows the aircraft from flight to flight, so its callsign is shown on its own
    // line, with an age; only a flight watch has a fixed callsign. On a flight or hex watch the tail gets a
    // copy button, so an aircraft first followed by callsign can be re-added by registration.
    li.innerHTML = `<button class="del" title="Remove">✕</button><button class="pause"></button><button class="notebtn"></button><b></b> <span class="${w.status}">${w.status}</span><small></small>`;
    li.querySelector('b').textContent = title;
    // Notes about the aircraft: a faint icon when there are none, a count when there are. Needs a hex (an aircraft).
    const nb = li.querySelector('.notebtn');
    nb.hidden = !w.hex;
    nb.className = 'notebtn' + (w.notes ? '' : ' empty');
    nb.textContent = w.notes ? `\u{1F4DD} ${w.notes}` : '\u{1F4DD}';
    nb.title = w.notes ? `${w.last_note}\n\n(${w.notes} note${w.notes > 1 ? 's' : ''}: click to read, add or edit)` : 'Add a note about this airframe';
    nb.onclick = e => { e.stopPropagation(); openNotes(w); };
    // Pause stops everything being fetched for the aircraft while it stays in the list with all its data. Offered
    // most plainly once it has landed.
    const pb = li.querySelector('.pause');
    const isOpen = w.status === 'waiting' || w.status === 'tracking', isPaused = w.status === 'paused';
    // A tail or hex watch that has run out can be carried on, as the same row (a flight watch cannot: its window has passed).
    const runOut = (w.status === 'done' || w.status === 'expired') && (w.kind === 'tail' || w.kind === 'hex');
    pb.hidden = !(isOpen || isPaused || runOut);
    pb.textContent = runOut ? '\u25b6 Watch again' : isPaused ? '\u25b6 Resume' : '\u23f8 Pause';
    pb.className = 'pause' + (w.landing && isOpen ? ' suggest' : '');
    pb.title = runOut ? 'Follow this aircraft again, for the default 36 hours' : isPaused ? 'Resume tracking' : w.landing ? `It is on the ground at ${w.landing.code}: pause to stop polling for it. It stays in the list with everything we hold about it.`
      : 'Stop polling for it. It stays in the list with everything we hold about it.';
    pb.onclick = async e => {
      e.stopPropagation();

        if (runOut) await api('/api/watches', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({input: `${w.kind}:${w.ident}`, hex: w.hex})});
        else await api('/api/watches/' + w.id, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({paused: !isPaused})});
        $('#err').textContent = '';
      } catch (err) { $('#err').textContent = err.message; }
      await refresh();
      const cur = watches.find(x => x.id === selected);
      if (cur) showTrack(cur, false);   // the plane and the projection follow the new state
    };
    // How the app read what was typed, so a misreading (a callsign taken for a registration) shows at a glance.
    const chip = document.createElement('span');
    chip.className = 'kindchip';

    li.querySelector('b').append(chip);
    const idLine = li.querySelector('small');

    if (w.hex) bits.push(copyable(w.hex));

    idLine.append(document.createTextNode(`${bits.length ? ' — ' : ''}${fmt(w.start)} → ${fmt(w.end)}`));

      r.textContent = `${w.route.from ? routeEnd(w.route.from, w.route.from_manual, w.route.from_seen) + ' → ' : '→ '}${routeEnd(w.route.to, w.route.to_manual)} (${w.route.source}${w.route.t ? ' ' + ago(w.route.t) : ''}${w.route.stale ? ', may be out of date' : ''}${differs})`;
      r.title = [w.route.from_name && `From ${w.route.from_name}`, w.route.to_name && `To ${w.route.to_name}`].filter(Boolean).join('\n');

    li.querySelector('.del').onclick = async e => { e.stopPropagation(); await api('/api/watches/' + w.id, {method: 'DELETE'}); refresh(); };
    li.onclick = () => {

}

// The side panel of notes for one aircraft; the counts on the watch list follow when notes change.
function openNotes(w) {
  $('#notestitle').textContent = `Notes \u00b7 ${w.tail || w.hex}${w.type ? ' \u00b7 ' + w.type : ''}`;
  $('#notespanel').hidden = false;

}
$('#notesclose').onclick = () => { $('#notespanel').hidden = true; };

// Tooltip content as DOM nodes: message text comes off the radio and must never be parsed as HTML.
// A REP081 summary already carries the weather ("REP081 VHHH\u2192YSSY 12.345N 150.000E FL380, OAT -52.0\u00b0C, wind
// 270\u00b0/80kt"): in a hover it is broken at the OAT, and the weather line is not repeated underneath.
function hoverSummary(m) {
  const i = m.summary.indexOf(', OAT ');
  return i < 0 ? {lines: [m.summary], hasWx: false} : {lines: [m.summary.slice(0, i), m.summary.slice(i + 2)], hasWx: true};
}
function wxLine(m) {
  const w = m.wx;
  if (!w) return '';
  const parts = [];
  const dir = w.dir != null ? `${String(Math.round(w.dir) % 360).padStart(3, '0')}°` : null;   // the direction it blows from
  if (dir && w.kt != null) parts.push(`wind ${dir}/${Math.round(w.kt)}kt`);
  else if (w.kt != null) parts.push(`wind ${Math.round(w.kt)}kt`);
  else if (dir) parts.push(`wind ${dir}`);
  if (w.temp_c != null) parts.push(`${Math.round(w.temp_c * 10) / 10}°C`);
  return parts.join(' · ');
}

// ---- wind barbs --------------------------------------------------------------------------------
// A wind barb as drawn for winds aloft: a staff pointing the way the wind comes FROM, with a half barb for each
// 5 kt, a full barb for 10 and a pennant for 50 (the speed is rounded to 5 kt), the barbs on the clockwise side.

const motionLine = m => [m.gs != null ? `${Math.round(m.gs)} kt` : '', m.trk != null ? `track ${Math.round(m.trk)}°` : ''].filter(Boolean).join(' · ');

const num = v => Math.round(v).toLocaleString('en-US');

    if (ref) fpm = (last.alt_ft - ref.alt_ft) / ((t1 - new Date(ref.t)) / 60000);

// The flight the aircraft is on, for its hover: the newest flight we have worked out ("SQ23 KJFK \u2192 WSSS") and when it left;

function flightLines(w) {

  const route = sg && (sg.from || sg.to) ? routeText(sg) : w.route && !w.route.stale ? `${w.route.from ? routeEnd(w.route.from, w.route.from_manual, w.route.from_seen) + ' \u2192 ' : '\u2192 '}${routeEnd(w.route.to, w.route.to_manual)}` : '';

// What to show when hovering the aircraft: callsign, altitude and trend, speed and track, time and source.
function aircraftTip(w, pts, fixMs) {

  const t = p.on_ground ? '' : trend(pts);

// An aeroplane silhouette (Material "airplanemode_active", nose up), turned to the track.
const PLANE_PATH = 'M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';

  if (landed) fill = '#2b8a3e';

    className: 'plane', iconSize: [30, 30], iconAnchor: [15, 15],
    html: (step && step.ring ? '<span class="agering"></span>' : '') +
          `<svg viewBox="0 0 24 24" width="30" height="30" style="transform: rotate(${deg}deg); opacity: ${Number(opacity)}">` +
          `<path d="${PLANE_PATH}" fill="${fill}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>` +
          (landed ? '<span class="agebadge s5">landed</span>' : step ? `<span class="agebadge s${step.n}">${ago(Date.now() - ageMs).replace(' ago', '')}</span>` : ''),

// How the tracked aircraft is named in a tooltip: its registration first, then the flight it is

function aircraftName(w, callsign, withType = true) {

  return [w.tail, flight, withType ? w.type : ''].filter(Boolean).join(' · ') || w.hex;
}

// ---- waypoints named in CPDLC position reports -----------------------------
function wptIcon(exact) {

}
const ROLE_TEXT = {passed: w => `passed${w.t ? ' ' + fmtTime(w.t) : ''}${w.alt_ft ? ' at ' + num(w.alt_ft) + ' ft' : ''}`,

// A filed route as a path to walk along: where a fix lies on it, and the point, bearing and line between
// distances along it. Legs are straight on the map (as they are drawn), measured on the local flat plane.
// Null if the fix is not on the route: too far from it, or heading across it.
function walkRoute(plan, L0, trk) {
  const P = plan && plan.points;

  for (const g of legs) {

    const u = Math.max(0, Math.min(1, (px * g.dx + py * g.dy) / (g.d * g.d)));

    // (s is how far along the route it is): the projection uses it to start at the aircraft, not on the line.
    path(s0, s1, shift = p => p) {

// ahead of the aircraft is made to run from the aircraft through those waypoints and then rejoin the plan. Returns
// {plan, n} (the plan with its first legs replaced, and how many waypoints were used) or null if there is nothing
// to use: no recent report, the waypoints already passed or not ahead, or the plan not near where they end.
function patchPlan(plan, msgs, L0, trk, nowMs) {

  return {fix: L0, ageMin, gs, trk, basis, stop, now: place(nowNm), end: place(endNm), ticks, onRoute: !!route,
          pathToNow: route ? route.path(route.at, route.at + nowNm, shift) : null, pathFromFix: route ? route.path(route.at, route.at + endNm, shift) : null, pathFromNow: route ? route.path(route.at + nowNm, route.at + endNm, shift) : null,
          endMin: endMin - Math.max(ageMin, 0), capped: ageMin + ahead > PROJ.maxSpanMin};
}

// Where the aircraft probably was when a message with no position of its own arrived: along the line
// between the nearest trustworthy fixes either side of it. Only between two fixes, never beyond the
// last (the live projection covers that), nor across a long silence, a change of flight or a jump
// no aircraft could make.
const GHOST = {maxGapMin: 180};
function ghostAt(tMs, pts, msgs) {
  const fixes = [
    ...pts.map(p => ({lat: p.lat, lon: p.lon, t: Date.parse(p.t), src: p.source || 'ADS-B'})),
    ...msgs.filter(m => m.lat != null && !m.suspect && !m.time_unverified).map(m =>
      ({lat: m.lat, lon: m.lon, t: Date.parse(m.pos_t || m.t), src: SOURCES[m.kind] ? SOURCES[m.kind].name : m.kind})),
  ].sort((a, b) => a.t - b.t);
  let before = null, after = null;
  for (const f of fixes) {
    if (f.t <= tMs) before = f;
    else { after = f; break; }
  }
  if (!before || !after) return null;
  const gap = after.t - before.t;
  if (gap > GHOST.maxGapMin * 60000) return null;
  if (flightSegs.length > 1 && segOf(before.t) !== segOf(after.t)) return null;
  const nm = distNM(before.lat, before.lon, after.lat, after.lon);
  if (nm / (gap / 3600000) > PROJ.maxGs) return null;
  const trk = bearingTo(before.lat, before.lon, after.lat, after.lon);
  const [lat, lon] = nm < 0.05 ? [before.lat, before.lon] : advance(before.lat, before.lon, trk, nm * (tMs - before.t) / gap);
  return {lat, lon, trk, before, after};
}

function drawGhost(m, pan) {
  const g = ghostAt(Date.parse(reportTime(m)), lastTrack.pts, lastTrack.msgs);
  if (!g) return;
  const mk = L.marker(ll(g.lat, g.lon), {icon: planeIcon(g.trk, {fill: '#777', opacity: .6}), zIndexOffset: 900}).addTo(highlight)
    .bindTooltip(tip(`Estimated position at ${fmtTime(reportTime(m))}`, 'this message carried no position',
      `between the ${g.before.src} fix at ${fmtTime(g.before.t)} and the ${g.after.src} fix at ${fmtTime(g.after.t)}`));
  if (pan && !map.getBounds().pad(-0.1).contains(ll(g.lat, g.lon))) map.panTo(ll(g.lat, g.lon));
  mk.openTooltip();
}

// ---- the filed flight plan ---------------------------------------------------------------
// The plan an aircraft sent for the flight being shown: the newest one that arrived within half a day
// before the flight began and before it ended (plans go out at the gate), or, with no flight chosen, in
// the last two days. Plans arrive oldest first.
function choosePlan(plans, chosen, nowMs = Date.now()) {
  const lo = chosen ? chosen.startMs - 12 * 3600000 : nowMs - 48 * 3600000;
  const hi = chosen ? chosen.endMs + FLIGHT_TOL : nowMs + 5 * 60000;
  const ok = (plans || []).filter(p => { const t = Date.parse(p.t); return !isClearance(p) && t >= lo && t <= hi && p.points && p.points.length >= 2; });
  return ok.length ? ok[ok.length - 1] : null;
}

// A clearance is a route the aircraft was cleared to fly, drawn apart from the filed plan, which stays the flight's route: the
// oceanic clearance gives the route over the ocean (only its own fixes), the pre-departure clearance the one from the gate (the
// origin and the fixes it names, stopping short of the destination). Those that arrived during the flight shown (or in the last two days).
const isClearance = p => p.kind === 'clearance' || p.kind === 'pdc';
const CLEARANCE_COLOR = '#0f766e', PDC_COLOR = '#b45309';
function drawClearances(plans, chosen, nowMs = Date.now()) {
  clearanceGroup.clearLayers();
  const lo = chosen ? chosen.startMs - 12 * 3600000 : nowMs - 48 * 3600000;
  const hi = chosen ? chosen.endMs + FLIGHT_TOL : nowMs + 5 * 60000;
  for (const c of plans || []) {
    const t = Date.parse(c.t);
    if (!isClearance(c) || t < lo || t > hi || !c.points || c.points.length < 2) continue;
    const pdc = c.kind === 'pdc', color = pdc ? PDC_COLOR : CLEARANCE_COLOR;
    L.polyline(c.points.map(p => ll(p.lat, p.lon)), {color, weight: 3, dashArray: '2 7', opacity: .8, interactive: false}).addTo(clearanceGroup);
    const head = `${c.callsign ? c.callsign + ' ' : ''}cleared to ${c.to}`;
    for (const p of c.points) {
      L.circleMarker(ll(p.lat, p.lon), {radius: p.kind === 'airport' ? 5 : 3, color, weight: 1.5, fillColor: '#fff', fillOpacity: 1}).addTo(clearanceGroup)
        .bindTooltip(tip(p.name, `${pdc ? 'departure' : 'oceanic'} clearance ${head}`, c.detail, `${pdc ? 'issued' : 'received'} ${fmtAgo(c.t)}`, c.missing && c.missing.length ? `not placed: ${c.missing.join(', ')}` : ''));
    }
  }
}

const PLAN_COLOR = '#5c6b8a';
function drawPlan(plan) {
  planGroup.clearLayers();
  if (!plan) return;
  L.polyline(plan.points.map(p => ll(p.lat, p.lon)), {color: PLAN_COLOR, weight: 2, dashArray: '8 6', opacity: .7, interactive: false}).addTo(planGroup);
  const head = `${plan.callsign ? plan.callsign + ' ' : ''}${plan.from} \u2192 ${plan.to}`;
  plan.points.forEach((p, i) => {
    const last = i === plan.points.length - 1;
    L.circleMarker(ll(p.lat, p.lon), {radius: p.kind === 'airport' ? 5 : 3, color: PLAN_COLOR, weight: 1.5, fillColor: '#fff', fillOpacity: 1}).addTo(planGroup)
      .bindTooltip(tip(p.name, p.via && !last ? `then ${p.via}` : '', `planned route ${head}`, `filed ${fmtAgo(plan.t)}`,
        p.kind === 'fix' ? 'position from nav db (2013 src)' : p.kind === 'learned' ? 'position from nav db (learned)' : '', plan.missing && plan.missing.length && i === 0 ? `not placed: ${plan.missing.join(', ')}` : ''));
  });
}

// ---- estimated path across a silence, and hoverable ADS-B points ----------------------------
// Where the aircraft went quiet and was next heard from (an ADS-C track handing over to ADS-B, or a gap in
// ADS-B coverage), the line between the two fixes is a guess: along the filed route if the plan covers both, else
// straight. Fixes close together in time are one continuous track and need none.
const BRIDGE = {minMin: 5};
function estimatedPaths(pts, msgs, plan) {
  const unified = trackMode === 'unified';
  const fixes = unified ? unifiedFixes(pts, msgs) : [
    ...pts.map(p => ({lat: p.lat, lon: p.lon, t: Date.parse(p.t), key: ptKey(p)})),
    ...msgs.filter(m => m.lat != null && !m.suspect && !m.time_unverified).map(m => ({lat: m.lat, lon: m.lon, t: Date.parse(m.pos_t || m.t), key: m.kind})),
  ].filter(f => !Number.isNaN(f.t)).sort((a, b) => a.t - b.t);
  const out = [];
  for (let i = 0; i + 1 < fixes.length; i++) {
    const a = fixes[i], b = fixes[i + 1], dt = b.t - a.t;
    if (dt < BRIDGE.minMin * 60000 || dt > GHOST.maxGapMin * 60000) continue;
    // already one solid track: in the unified view whatever the two sources, otherwise only within one source
    if (unified ? dt <= pairGapMin(a, b) * 60000 : a.key === b.key && dt <= (SOURCES[a.key] ? SOURCES[a.key].gapMin : 90) * 60000) continue;
    if (flightSegs.length > 1 && segOf(a.t) !== segOf(b.t)) continue;
    const nm = distNM(a.lat, a.lon, b.lat, b.lon);
    if (nm / (dt / 3600000) > PROJ.maxGs) continue;
    let path = [[a.lat, a.lon], [b.lat, b.lon]], via = 'straight';
    const ra = walkRoute(plan, a, null), rb = walkRoute(plan, b, null);
    if (ra && rb && rb.at > ra.at + 1) {
      const mid = ra.path(ra.at, rb.at).slice(1, -1);
      path = [[a.lat, a.lon], ...mid, [b.lat, b.lon]];
      via = 'route';
    }
    out.push({from: a, to: b, path, via, nm, minutes: Math.round(dt / 60000)});
  }
  return out;
}

// ---- the unified track ----------------------------------------------------------------------
const ptKey = p => p.source === 'aerodatabox' ? 'lookup' : 'adsb';
// How long a silence between two fixes still counts as one track: the sparser of the two sources sets the cadence.
const pairGapMin = (a, b) => Math.max((SOURCES[a.key] || {gapMin: 90}).gapMin, (SOURCES[b.key] || {gapMin: 90}).gapMin);
// A report within this long of ADS-B on both sides adds nothing to the line (ADS-B is denser and more exact, and a
// report's rounded position and minute-resolution time would only make a zigzag in it): it keeps its dot but not its line.
const UNIFIED = {adsbCoverMin: 3};
const impossibleMove = (a, b) => { const dt = b.t - a.t, d = distNM(a.lat, a.lon, b.lat, b.lon); return dt <= 0 ? d > 20 : d / (dt / 3600000) > 700; };
// Every fix the one line may run through, in time order: not flagged impossible, time not unverified, from a source that is
// ticked in the legend, not made redundant by ADS-B, and not a lone outlier (a fix that is impossible from the last good one
// while the next fix is fine from it is the odd one out; two in a row that disagree are a real jump).
function unifiedFixes(pts, msgs) {
  const on = key => { const src = SOURCES[key]; return !src || !src.group || map.hasLayer(src.group); };
  let all = [
    ...pts.map(p => ({lat: p.lat, lon: p.lon, t: Date.parse(p.t), key: ptKey(p)})),
    ...msgs.filter(m => m.lat != null && !m.suspect && !m.time_unverified).map(m => ({lat: m.lat, lon: m.lon, t: Date.parse(m.pos_t || m.t), key: m.kind})),
  ].filter(f => !Number.isNaN(f.t) && on(f.key)).sort((a, b) => a.t - b.t);
  const adsb = all.filter(f => f.key === 'adsb').map(f => f.t), win = UNIFIED.adsbCoverMin * 60000;
  let j = 0;
  all = all.filter(f => {
    if (f.key === 'adsb' || f.key === 'lookup') return true;
    while (j < adsb.length && adsb[j] < f.t - win) j++;   // all is sorted by time, so j only moves forward
    let before = false, after = false;
    for (let k = j; k < adsb.length && adsb[k] <= f.t + win; k++) { if (adsb[k] <= f.t) before = true; else after = true; }
    return !(before && after);
  });
  const out = [];
  for (let i = 0; i < all.length; i++) {
    const f = all[i], last = out[out.length - 1], next = all[i + 1];
    if (last && impossibleMove(last, f) && next && !impossibleMove(last, next)) continue;
    out.push(f);
  }
  return out;
}
// The unified track as runs of consecutive fixes, each in one source's colour. Where the source changes the edge is
// split at its midpoint, so a report is flanked by its own colour on both sides. A run ends at a silence longer than
// the pair allows (the dotted estimate takes over), an impossible move, or a change of flight.
function unifiedRuns(fixes) {
  const runs = [];
  let cur = null;
  const flightOf = f => (flightSegs.length > 1 && !chosenFlight() ? segOf(f.t) : 0);
  const start = (f, pt = f) => { cur = {key: f.key, faded: flightSegs.length > 1 && !chosenFlight() && flightOf(f) !== flightSegs.length - 1, pts: [pt]}; runs.push(cur); };
  for (let i = 0; i < fixes.length; i++) {
    const f = fixes[i], a = fixes[i - 1];
    if (!a || !cur || f.t - a.t > pairGapMin(a, f) * 60000 || impossibleMove(a, f) || flightOf(a) !== flightOf(f)) { start(f); continue; }
    if (a.key === f.key) { cur.pts.push(f); continue; }
    const mid = {lat: (a.lat + f.lat) / 2, lon: (lonU(a.lon) + lonU(f.lon)) / 2};
    cur.pts.push(mid);
    start(f, mid);
    cur.pts.push(f);
  }
  return runs.filter(r => r.pts.length >= 2);
}

// Draws every track line for what showTrack last fetched, in the chosen mode, and the estimated paths across the silences.
// The by-source lines live in their source's group (so unticking it hides them); the unified ones in trackGroup.
function drawTrackLines() {
  trackGroup.clearLayers();
  for (const l of srcLines) l.group.removeLayer(l.line);
  srcLines = [];
  if (!trackCtx) { bridgeGroup.clearLayers(); return; }
  const {pts, msgs, chosen, plan} = trackCtx;
  const add = (group, line) => { line.addTo(group); if (line.bringToBack) line.bringToBack(); if (group !== trackGroup) srcLines.push({group, line}); };
  if (trackMode === 'unified') {
    for (const run of unifiedRuns(unifiedFixes(pts, msgs))) {
      const src = SOURCES[run.key];
      for (const part of trackParts(run.pts)) add(trackGroup, L.polyline(part, {color: src.color, weight: src.weight, opacity: run.faded ? .35 : .9}));
    }
  } else {
    // A track per source. Lines run through each source's positions in time order, skipping ones flagged impossible.
    const drawTrack = (key, fixes) => {
      const src = SOURCES[key];
      // flight by flight: a line never joins two flights, and the older ones are drawn fainter
      const byFlight = new Map();
      for (const f of fixes) { const i = flightSegs.length > 1 && !chosen ? segOf(f.t) : 0; if (!byFlight.has(i)) byFlight.set(i, []); byFlight.get(i).push(f); }
      for (const [i, group] of byFlight) {
        const faded = flightSegs.length > 1 && !chosen && i !== flightSegs.length - 1;
        for (const seg of segments(group, src.gapMin)) {
          for (const part of trackParts(seg)) add(src.group, L.polyline(part, {color: src.color, weight: src.weight, dashArray: src.dash, opacity: faded ? .35 : .9}));
        }
      }
    };
    const fixOf = p => ({lat: p.lat, lon: p.lon, t: new Date(p.t).getTime()});
    drawTrack('adsb', pts.filter(p => p.source !== 'aerodatabox').map(fixOf));
    drawTrack('lookup', pts.filter(p => p.source === 'aerodatabox').map(fixOf));   // the provider's own positions, e.g. over the ocean
    const byKind = {};
    for (const m of msgs) if (m.lat != null && SOURCES[m.kind] && !m.suspect) (byKind[m.kind] ||= []).push({lat: m.lat, lon: m.lon, t: new Date(m.pos_t || m.t).getTime()});
    for (const [kind, fixes] of Object.entries(byKind)) drawTrack(kind, fixes);
  }
  drawEstimatedPaths(estimatedPaths(pts, msgs, plan), plan);
}
function setTrackMode(mode) {
  if (mode === trackMode || !(mode in TRACK_MODES)) return;
  trackMode = mode;
  document.body.classList.toggle('bysource', mode === 'source');
  try { localStorage.setItem('trackMode', mode); } catch (e) { /* not saved: fine */ }
  drawTrackLines();
}
for (const [mode, g] of Object.entries(modeGroups)) g.on('add', () => setTrackMode(mode));
// Ticking or unticking a source adds or removes its barbs, and in the unified view its fixes in the one line.
for (const src of Object.values(SOURCES)) for (const ev of ['add', 'remove']) src.group.on(ev, () => { if (trackMode === 'unified' && trackCtx) drawTrackLines(); drawWindBarbs(); });

function drawEstimatedPaths(paths, plan) {
  bridgeGroup.clearLayers();
  for (const e of paths) {
    const name = k => (SOURCES[k] ? SOURCES[k].name : k);
    for (const part of trackParts(e.path.map(([lat, lon]) => ({lat, lon})))) {
      L.polyline(part, {color: '#777', weight: 2, dashArray: '2 6', opacity: .9}).addTo(bridgeGroup).bindTooltip(tip(
        'Estimated path', `${name(e.from.key)} fix ${fmtTime(e.from.t)} \u2192 ${name(e.to.key)} fix ${fmtTime(e.to.t)}`,
        `${e.minutes} min without a position, ${Math.round(e.nm)} nm`,
        e.via === 'route' ? `along the filed route ${plan.callsign ? plan.callsign + ' ' : ''}${plan.from}\u2192${plan.to}` : 'straight line: no filed route covers both'));
    }
  }
}

// ADS-B points worth hovering: not every one, which would be a solid string of dots. A point is kept if it is at
// least HOVER.minMin minutes and HOVER.minNM miles from the last one kept.
const HOVER = {minMin: 2.5, minNM: 6};
function thinPoints(pts) {
  const out = [];
  for (const p of pts) {
    const prev = out[out.length - 1];
    if (!prev || (Date.parse(p.t) - Date.parse(prev.t) >= HOVER.minMin * 60000 && distNM(prev.lat, prev.lon, p.lat, p.lon) >= HOVER.minNM)) out.push(p);
  }
  return out;
}
function pointTip(p) {
  return tip(p.callsign || '', fmtAgo(p.t) + (p.source ? ` (${p.source})` : ''), p.alt_ft != null ? `${num(p.alt_ft)} ft` : (p.on_ground ? 'on the ground' : ''),
    [p.gs != null ? `${Math.round(p.gs)} kt` : '', p.track != null ? `track ${Math.round(p.track)}\u00b0` : ''].filter(Boolean).join(' \u00b7 '));
}

function drawProjection() {
  refreshPlaneAge();
  projGroup.clearLayers();
  if (!lastData) return;
  const p = projection(lastData.w, lastData.pts, lastData.msgs, Date.now(), aheadMin, lastData.plan);
  if (!p) return;
  const f = p.fix, line = {color: '#555', weight: 2, interactive: false};
  const showGhost = p.ageMin * 60 >= PROJ.ghostAfterSec;
  if (showGhost) {
    L.polyline((p.pathToNow || [[f.lat, f.lon], p.now]).map(v => ll(...v)), {...line, dashArray: '2 6'}).addTo(projGroup);
    L.marker(ll(...p.now), {icon: planeIcon(p.trk, {fill: '#777', opacity: .55}), zIndexOffset: 900}).addTo(projGroup).bindTooltip(tip(
      `Estimated position now (${Math.round(p.ageMin)} min since the last fix)`, p.onRoute ? `along the filed route from the ${f.src} fix at ${fmtTime(f.t)}` : `dead reckoning from the ${f.src} fix at ${fmtTime(f.t)}`,
      p.basis, p.stop ? `stops at ${p.stop}` : '', 'error grows with every minute and a turn would make it wrong'));
  }
  const ahead = showGhost ? (p.pathFromNow || [p.now, p.end]) : (p.pathFromFix || [[f.lat, f.lon], p.end]);
  L.polyline(ahead.map(v => ll(...v)), {...line, dashArray: '2 10', opacity: .65}).addTo(projGroup);
  for (const t of p.ticks) {
    L.circleMarker(ll(t.lat, t.lon), {radius: 3, color: '#555', weight: 1, fillColor: '#fff', fillOpacity: 1}).addTo(projGroup)
      .bindTooltip(tip(`+${t.min} min (estimate)`, p.basis));
  }
  L.circleMarker(ll(...p.end), {radius: 4, color: '#555', weight: 2, fillColor: '#ddd', fillOpacity: 1}).addTo(projGroup).bindTooltip(tip(
    p.stop ? `Projection stops at the destination, ${p.stop}` : `End of the projection (+${Math.round(p.endMin)} min)`,
    p.capped ? 'limited to 90 minutes from the last fix' : '', p.basis));
}

// ---- flights ----------------------------------------------------------------------------
// The server divides an aircraft's history into flights (see /api/flights). A point belongs to the
// flight whose time span it falls in (within FLIGHT_TOL), so a plane like B-LRM with a week of history
// can show just its current flight, or all of them with the older ones faded and flagged.
const FLIGHT_TOL = 20 * 60000;
let flightSegs = [], flightChoice = 'recent';   // 'recent', 'all', or a flight's id
try { const v = localStorage.getItem('flightChoice'); if (v === 'all' || v === 'recent') flightChoice = v; } catch (e) { /* default */ }
const dayLabel = ms => new Date(ms).toUTCString().slice(5, 11);   // "30 Oct"
// An airport entered by hand rather than reported carries a star.
// (a tilde: the origin is where ADS-B saw the flight climb out, which no message gave)
const routeEnd = (code, manual, seen) => (code ? code + (manual ? '*' : seen ? '~' : '') : '?');
const segLabel = s => `${s.flight || 'unidentified'} \u00b7 ${dayLabel(s.startMs)}${s.from || s.to ? ` \u00b7 ${routeEnd(s.from, s.from_manual, s.from_seen)}\u2192${routeEnd(s.to, s.to_manual)}` : ''}`;
// How a flight is written where space is short (the flag on the map, the aircraft's hover): "SQ23 KJFK \u2192 WSSS", then
// when it left if we know ("dep 15:56Z" for a takeoff, "out 06:44Z" for leaving the gate).
const routeText = s => (s.from || s.to ? `${routeEnd(s.from, s.from_manual, s.from_seen)} \u2192 ${routeEnd(s.to, s.to_manual)}` : '');
const flightText = s => [s.flight || 'unidentified', routeText(s)].filter(Boolean).join(' ');
const hhmmZ = ms => new Date(ms).toISOString().slice(11, 16) + 'Z';
const departShort = s => (s.departed ? `${s.departed_how === 'pushback' || s.departed_how === 'taxi' ? 'out' : 'dep'} ${hhmmZ(Date.parse(s.departed))}` : '');
const departLong = s => {
  if (!s.departed) return '';
  const how = {takeoff: 'took off (takeoff report)', adsb: 'took off (seen leaving the ground)', pushback: 'left the gate (departure report)', taxi: 'began to taxi (departure report)'}[s.departed_how] || 'departed';
  return `${how} ${fmt(Date.parse(s.departed))}`;
};
// null means everything. A choice that no longer exists falls back to the most recent flight.
function chosenFlight() {
  if (!flightSegs.length || flightChoice === 'all') return null;
  return flightSegs.find(s => s.id === flightChoice) || flightSegs[flightSegs.length - 1];
}
// The index of the flight a time belongs to, or -1 (on the ground between flights, or unmatched).
function segOf(ms) {
  if (Number.isNaN(ms)) return -1;   // a time we cannot read belongs to no flight
  let best = -1, bestD = Infinity;
  flightSegs.forEach((s, i) => {
    const d = ms < s.startMs ? s.startMs - ms : ms > s.endMs ? ms - s.endMs : 0;
    if (d <= FLIGHT_TOL && d < bestD) { best = i; bestD = d; }
  });
  return best;
}
const isOlder = ms => !chosenFlight() && flightSegs.length > 1 && segOf(ms) !== flightSegs.length - 1;   // faded in the all-flights view

function syncFlightSelector() {
  const sel = $('#flightsel');
  const opts = flightSegs.length
    ? [['recent', `most recent: ${segLabel(flightSegs[flightSegs.length - 1])}`], ['all', `all flights (${flightSegs.filter(s => !s.older).length})`],
       ...flightSegs.slice().reverse().map(s => [s.id, segLabel(s)])]
    : [['recent', 'no flights identified yet']];
  sel.replaceChildren(...opts.map(([v, text]) => { const o = document.createElement('option'); o.value = v; o.textContent = text; return o; }));
  sel.value = opts.some(([v]) => v === flightChoice) ? flightChoice : 'recent';
  sel.disabled = !flightSegs.length;
  syncRouteEditor();
  syncJoinEditor();
}

// ---- two pieces of one flight ------------------------------------------------------------------
// The rules join a flight's pieces when the evidence says they are one; when it does not (a long silence with nothing in the air to
// show it), the flight can be joined to the one before it here (PUT /api/flights/{hex}/join), and split again.
function syncJoinEditor() {
  const sg = chosenFlight();
  const i = sg ? flightSegs.indexOf(sg) : -1;
  $('#joinedit').hidden = !sg;
  $('#joinbtn').hidden = !(i > 0);
  if (i > 0) $('#joinbtn').title = `Make this and ${segLabel(flightSegs[i - 1])} one flight`;
  $('#splitbtn').hidden = !(sg && sg.joined && sg.joined.length);
  $('#joinmsg').textContent = '';
  syncExplainLink(sg);
}
// The explain page (explain.html) opens on the aircraft, and on the chosen flight when there is one.
function syncExplainLink(sg) {

function callout(group, at, key, el, opts = {}) {

  const line = L.polyline([at, at], {color: opts.color || '#1d3557', weight: 1.5, opacity: .8, interactive: false}).addTo(group);
  const mk = L.marker(at, {icon: L.divIcon({className: opts.className || 'callout-wrap', iconSize: [0, 0], html: el}), draggable: true, keyboard: false,
                           zIndexOffset: opts.z || 400});
  const c = {
    place() {
      const o = calloutPos[key] || CALLOUT_OFFSET, p = map.latLngToLayerPoint(at);
      const to = map.layerPointToLatLng([p.x + o[0], p.y + o[1]]);

const markers = new Map();   // message id -> its marker on the map
let showSeq = 0;             // discards the result of a slower, superseded request
function distNM(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 3440.065 * Math.asin(Math.sqrt(h));
}

// Split fixes (any order) into tracks: sorted by time, broken wherever the aircraft was silent for longer
// than maxGapMin or the move to the next fix is impossible (over 700 kt). A lone fix draws no line.
function segments(fixes, maxGapMin) {
  const sorted = fixes.slice().sort((a, b) => a.t - b.t);
  const out = [];
  let cur = [];
  for (const f of sorted) {
    const p = cur[cur.length - 1];
    if (p) {
      const dt = f.t - p.t, d = distNM(p.lat, p.lon, f.lat, f.lon);
      const impossible = dt <= 0 ? d > 20 : d / (dt / 3600000) > 700;
      if (dt > maxGapMin * 60000 || impossible) { out.push(cur); cur = []; }
    }
    cur.push(f);
  }
  out.push(cur);
  return out.filter(seg => seg.length >= 2);
}

const FOCUS_ZOOM = 7;   // regional: a few hundred miles across

// The newest position we hold for an aircraft, from ADS-B or from a message. Trustworthy ones come
// first: a position flagged impossible, or one whose time is unverified, only counts if nothing
// better exists, so it cannot win just by claiming to be recent.
function latestFix(pts, msgs) {
  const all = [
    ...pts.map(p => ({lat: p.lat, lon: p.lon, t: new Date(p.t).getTime(), tier: 1, src: p.source, kind: 'adsb', ref: p})),
    ...msgs.filter(m => m.lat != null).map(m => ({lat: m.lat, lon: m.lon, t: new Date(m.pos_t || m.t).getTime(),
      tier: m.suspect ? 3 : m.time_unverified ? 2 : 1, src: m.kind, kind: 'msg', ref: m})),
  ];
  if (!all.length) return null;
  const best = Math.min(...all.map(f => f.tier));
  return all.filter(f => f.tier === best).reduce((a, b) => (b.t > a.t ? b : a));

// ---- flights older than the window -------------------------------------------------------
const WINDOW_HOURS = 96;      // the track, messages and plans fetched with the page

function olderFlightsCached(hex) { return olderFor === hex ? olderSegs : []; }

function loadOlderFlights(hex) {
  if (olderFor === hex && Date.now() - olderAt < OLDER_KEEP_MS) return Promise.resolve(olderSegs);
  if (olderPending && olderPending.hex === hex) return olderPending.p;
  const p = api(`/api/flights/${hex}?hours=720`).then(list => { olderFor = hex; olderAt = Date.now(); olderSegs = list; return list; })
    .catch(() => olderFlightsCached(hex)).finally(() => { olderPending = null; });

    Object.values(SOURCES).forEach(src => src.group.clearLayers());   // the report dots and each source's track
    trackGroup.clearLayers(); srcLines = []; trackCtx = null;
    lastData = null; lastTrack = {pts: [], msgs: []}; drawProjection(); markers.clear(); renderMessages([]);
    flightSegs = []; syncFlightSelector();

  }

  if (seq !== showSeq) return;
  // Flights older than the window are listed too (for a month back), and chosen one at a time. Their list is fetched apart and
  // kept for a few minutes; it is waited for only if the flight asked for is not among the recent ones.
  const needOlder = !recent.length || (flightChoice !== 'recent' && flightChoice !== 'all' && !recent.some(sg => sg.id === flightChoice));

    limit = '&limit=1000';

    api(`/api/plan/${w.hex}?${span}`).catch(() => [])]);
  if (seq !== showSeq) return;
  // One flight chosen: only its points and messages are shown.

  wptGroup.clearLayers();

  // (The track lines are drawn by drawTrackLines, once the plan is known.)

    for (const p of thinPoints(group)) {
      const faded = isOlder(Date.parse(p.t));
      L.circleMarker(ll(p.lat, p.lon), {radius: 3, weight: 1, color: SOURCES[key].color, fillColor: '#fff', opacity: faded ? .4 : 1, fillOpacity: faded ? .4 : .9})
        .addTo(SOURCES[key].group).bindTooltip(pointTip(p));
    }

  // their time is unverified), and a track through them.

    const src = SOURCES[m.kind];

      opacity: isOlder(Date.parse(reportTime(m))) ? .4 : 1,
      fillOpacity: m.time_unverified ? .2 : isOlder(Date.parse(reportTime(m))) ? .3 : .8, dashArray: m.time_unverified ? '2 2' : null,
    }).addTo(src ? src.group : layer);
