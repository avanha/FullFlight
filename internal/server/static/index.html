<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullFlight</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { padding: 12px; overflow: auto; border-right: 1px solid #ccc; }
  #map { height: 100%; }
  form { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  input[name=input] { flex: 1 1 100%; padding: 6px; }
  input[name=until] { flex: 1; padding: 6px; }
  .hint { color: #666; font-size: 12px; margin: 0 0 12px; }
  #err { color: #b00; min-height: 1.2em; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
  li.sel { background: #eef4ff; }
  li small { color: #666; display: block; }
  li small.lastpos { color: #333; }
  li small.route, li small.flight { color: #333; }
  li small.route.stale, li small.flight.stale { color: #999; font-style: italic; }
  .waiting { color: #a60; } .tracking { color: #070; } .done, .expired { color: #888; }
  button.del { float: right; }
  button.copy { border: none; background: none; cursor: pointer; padding: 0 3px; font-size: 11px; vertical-align: baseline; }
  button.copy:hover { background: #e8eefc; border-radius: 3px; }
  h4 { margin: 14px 0 4px; }
  #msgs .msg { padding: 5px 4px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 12px; }
  #msgs .msg time { color: #666; font-family: ui-monospace, monospace; margin-right: 6px; }
  #msgs time.rt { border-bottom: 1px dotted #888; cursor: help; }
  #msgs .kind { background: #eef; border-radius: 3px; padding: 0 4px; margin-right: 4px; font-size: 11px; }
  #msgs .warn { color: #b60; cursor: help; margin-left: 4px; }
  #msgs pre { white-space: pre-wrap; word-break: break-all; background: #f6f6f6; padding: 6px; margin: 4px 0 0; font-size: 11px; }
  #msgs .empty { color: #888; padding: 4px; }
  #msgs .msg.sel { background: #fff3bf; }
  #msgs .msg.hasloc { border-left: 3px solid #d60; }
  .plane { background: none; border: none; }
  .wpt-wrap { background: none; border: none; }
  .wpt { width: 8px; height: 8px; margin: 3px; transform: rotate(45deg); background: #fff; border: 2px solid #1d3557; box-sizing: content-box; }
  .wpt.est { border-style: dashed; border-color: #6b7a8f; background: transparent; opacity: .9; }
  .plane svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  #clock { position: fixed; top: 8px; right: 8px; z-index: 1000; padding: 3px 8px; border-radius: 4px;
           background: rgba(255,255,255,.9); border: 1px solid #aaa; font: 13px ui-monospace, monospace; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: auto 50vh; height: auto; } }
</style>
</head>
<body>
<aside>
  <h3 style="margin-top:0">FullFlight</h3>
  <form id="add">
    <input name="input" placeholder="UA869 2026-10-31 [SFO]   or   CPA113   or   B-LRM   or   780AB8" required autocomplete="off">
    <input name="until" type="datetime-local" title="Optional end (tail/hex only; default 36 h)">
    <button>Watch</button>
  </form>
  <p class="hint">Flight + date waits for takeoff; an optional destination (IATA or ICAO) ends the watch on arrival there instead of after a long ground stop. A tail or hex tracks now until the end time (default 36 h).</p>
  <div id="err"></div>
  <ul id="list"></ul>
  <p class="hint" style="margin:8px 0 0"><label>Projection: look ahead
    <select id="ahead"><option value="0">off</option><option value="15">15 min</option><option value="30">30 min</option><option value="60">60 min</option></select></label>
    <span title="Dead reckoning from the newest fix. Never from a fix over an hour old, never more than 90 minutes from the fix, never past a known destination.">ⓘ</span></p>
  <h4>Messages</h4>
  <div id="msgs"><div class="empty">Select a watch that has an aircraft.</div></div>
</aside>
<div id="map"></div>
<div id="clock" title="Current time, UTC"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([30, -40], 3);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap'}).addTo(map);
const layer = L.layerGroup().addTo(map);      // track, message positions, route: redrawn on refresh
const highlight = L.layerGroup().addTo(map);  // ring around the selected message's position

// One layer per position source, so each track can be switched on and off from the legend.
// gapMin: a silence longer than this ends a track rather than being bridged by a straight line.
const SOURCES = {
  adsb:         {name: 'ADS-B', color: '#0b66d0', dash: null,         weight: 3, gapMin: 20},
  adsc:         {name: 'ADS-C', color: '#e8590c', dash: null,         weight: 2, gapMin: 90},
  cpdlc:        {name: 'CPDLC', color: '#7b2cbf', dash: '10 4 2 4',   weight: 2, gapMin: 150},
  miam:         {name: 'REP081', color: '#0a9396', dash: '8 4',       weight: 2, gapMin: 90},
  fms_position: {name: 'FMS',   color: '#2b9348', dash: '2 5',        weight: 2, gapMin: 60},
};
for (const src of Object.values(SOURCES)) src.group = L.layerGroup().addTo(map);
L.control.layers(null, Object.fromEntries(Object.values(SOURCES).map(src =>
  [`<span style="color:${src.color};font-weight:bold">&#9472;&#9472;</span> ${src.name}`, src.group])),
  {collapsed: false, position: 'bottomleft'}).addTo(map);
const wptGroup = L.layerGroup().addTo(map);   // waypoints named in CPDLC position reports
const projGroup = L.layerGroup().addTo(map);  // dead-reckoned position and look-ahead
L.control.layers(null, {
  '<span style="font-weight:bold">&#9671;</span> Waypoints': wptGroup,
  '<span style="color:#666;font-weight:bold">&middot;&middot;&middot;</span> Projection': projGroup,
}, {collapsed: false, position: 'bottomleft'}).addTo(map);
// ---- longitude frame --------------------------------------------------------------------
// The map's longitude is continuous (181 is the same place as -179, drawn one world over), so near
// the date line everything must be drawn in ONE frame or a track from 179 to -179 is a line right
// round the world. Every coordinate handed to the map goes through ll(), which picks the copy of the
// longitude nearest lonRef: the longitude of the aircraft's newest fix when it was chosen. lonRef stays
// put while the aircraft flies on, so a track that crosses 180 just carries on to 181, 182, ...
let lonRef = null;
const lonU = lon => lon + 360 * Math.round(((lonRef ?? 0) - lon) / 360);
const ll = (lat, lon) => [lat, lonU(lon)];
// A track's points in that frame, cut wherever two neighbours would be over 180 degrees apart
// (the far end of a very long history, which is on the other side of the world from lonRef).
function trackParts(fixes) {
  const parts = [];
  let cur = [];
  for (const f of fixes) {
    const lon = lonU(f.lon);
    if (cur.length && Math.abs(lon - cur[cur.length - 1][1]) > 180) { parts.push(cur); cur = []; }
    cur.push([f.lat, lon]);
  }
  parts.push(cur);
  return parts.filter(part => part.length >= 2);
}
let selected = null, watches = [];
const $ = s => document.querySelector(s);
const fmt = t => new Date(t).toISOString().slice(0, 16).replace('T', ' ') + 'Z';
const fmtTime = t => new Date(t).toISOString().slice(11, 19) + 'Z';
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - new Date(t)) / 1000));
  if (s < 90) return s + 's ago';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  if (s < 48 * 3600) return (s / 3600).toFixed(1).replace(/\.0$/, '') + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 204) return null;
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// Copy text to the clipboard. The async clipboard API only exists on secure pages (https or
// localhost), so fall back to the old select-and-copy trick when the page is served over plain http.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through to the fallback */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function copyButton(text) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'copy';
  const reset = () => { b.textContent = '\u{1F4CB}'; b.title = `Copy ${text}`; };
  reset();
  b.onclick = async e => {
    e.stopPropagation();           // do not also select the watch
    const ok = await copyText(text);
    b.textContent = ok ? '\u2713' : '!';
    b.title = ok ? 'Copied' : 'Could not copy';
    setTimeout(reset, 1200);
  };
  return b;
}

async function refresh() {
  watches = await api('/api/watches');
  const ul = $('#list');
  ul.replaceChildren(...watches.map(w => {
    const li = document.createElement('li');
    li.className = w.id === selected ? 'sel' : '';
    const title = w.kind === 'flight' ? `${w.ident}${w.date ? ' ' + w.date : ''}${w.dest ? ' → ' + w.dest : ''}` : w.ident;
    // A tail or hex watch follows the aircraft from flight to flight, so its callsign is shown on its own
    // line, with an age; only a flight watch has a fixed callsign. On a flight or hex watch the tail gets a
    // copy button, so an aircraft first followed by callsign can be re-added by registration.
    li.innerHTML = `<button class="del" title="Remove">✕</button><b></b> <span class="${w.status}">${w.status}</span><small></small>`;
    li.querySelector('b').textContent = title;
    const idLine = li.querySelector('small');
    const bits = [];
    if (w.kind === 'flight' && w.callsign) bits.push(document.createTextNode(w.callsign));
    if (w.tail) {
      const t = document.createElement('span');
      t.append(document.createTextNode(w.tail));
      if (w.kind !== 'tail') t.append(copyButton(w.tail));
      bits.push(t);
    }
    if (w.hex) bits.push(document.createTextNode(w.hex));
    bits.forEach((b, i) => { if (i) idLine.append(document.createTextNode(' · ')); idLine.append(b); });
    idLine.append(document.createTextNode(`${bits.length ? ' — ' : ''}${fmt(w.start)} → ${fmt(w.end)}`));
    if (w.last_pos || w.type) {
      const lp = document.createElement('small');
      lp.className = 'lastpos';
      lp.textContent = [w.last_pos && `last ${w.last_pos.kind} ${fmtTime(w.last_pos.t)} (${ago(w.last_pos.t)})`, w.type].filter(Boolean).join(' · ');
      li.append(lp);
    }
    if (w.flight) {
      const f = document.createElement('small');
      f.className = 'flight' + (w.flight.stale ? ' stale' : '');
      const name = [w.flight.callsign, w.flight.number].filter(Boolean).join(' · ');
      f.textContent = `flight ${name} (${w.flight.source === 'messages' ? 'from messages' : w.flight.source} ${ago(w.flight.t)}${w.flight.stale ? ', may be out of date' : ''})`;
      li.append(f);
    }
    if (w.route) {
      const r = document.createElement('small');
      r.className = 'route' + (w.route.stale ? ' stale' : '');
      const differs = w.dest && w.route.to && w.dest !== w.route.to ? ` — you set ${w.dest}` : '';
      r.textContent = `${w.route.from ? w.route.from + ' → ' : '→ '}${w.route.to} (${w.route.source} ${ago(w.route.t)}${w.route.stale ? ', may be out of date' : ''}${differs})`;
      r.title = [w.route.from_name && `From ${w.route.from_name}`, w.route.to_name && `To ${w.route.to_name}`].filter(Boolean).join('\n');
      li.append(r);
    }
    li.querySelector('.del').onclick = async e => { e.stopPropagation(); await api('/api/watches/' + w.id, {method: 'DELETE'}); refresh(); };
    li.onclick = () => {
      if (selected !== w.id) { selectedMsg = null; expanded.clear(); highlight.clearLayers(); }
      selected = w.id;
      refresh();
      showTrack(w, true);
    };
    return li;
  }));
}

// Tooltip content as DOM nodes: message text comes off the radio and must never be parsed as HTML.
function wxLine(m) {
  const w = m.wx;
  if (!w) return '';
  const parts = [];
  if (w.dir != null && w.kt != null) parts.push(`wind ${String(Math.round(w.dir) % 360).padStart(3, '0')}°/${Math.round(w.kt)} kt`);
  else if (w.kt != null) parts.push(`wind ${Math.round(w.kt)} kt`);
  if (w.temp_c != null) parts.push(`${Math.round(w.temp_c * 10) / 10}°C`);
  return parts.join(' · ');
}
const motionLine = m => [m.gs != null ? `${Math.round(m.gs)} kt` : '', m.trk != null ? `track ${Math.round(m.trk)}°` : ''].filter(Boolean).join(' · ');

function tip(...lines) {
  const d = document.createElement('div');
  d.append(...lines.filter(Boolean).map(l => { const r = document.createElement('div'); r.textContent = l; return r; }));
  return d;
}

const num = v => Math.round(v).toLocaleString('en-US');
// Climbing or descending, with an arrow. Uses the reported vertical rate; if the feed gave none,
// estimates it from the altitude change over the last few minutes. Under 200 ft/min is level.
function trend(pts) {
  const last = pts[pts.length - 1];
  let fpm = last.vrate;
  if (fpm == null && last.alt_ft != null) {
    const t1 = new Date(last.t).getTime();
    const ref = [...pts].reverse().find(p => p.alt_ft != null && t1 - new Date(p.t) >= 60000 && t1 - new Date(p.t) <= 600000);
    if (ref) fpm = (last.alt_ft - ref.alt_ft) / ((t1 - new Date(ref.t)) / 60000);
  }
  if (fpm == null) return '';
  if (Math.abs(fpm) < 200) return '→ level';
  return fpm > 0 ? `↑ climbing ${num(fpm)} ft/min` : `↓ descending ${num(-fpm)} ft/min`;
}

// What to show when hovering the aircraft: callsign, altitude and trend, speed and track, time and source.
function aircraftTip(w, pts) {
  const p = pts[pts.length - 1];
  const alt = p.on_ground ? 'on the ground' : p.alt_ft != null ? `${num(p.alt_ft)} ft` : 'altitude unknown';
  const t = p.on_ground ? '' : trend(pts);
  const motion = [p.gs != null ? `${num(p.gs)} kt` : '', p.track != null ? `track ${Math.round(p.track)}°` : ''].filter(Boolean).join(' · ');
  const dest = w.route && !w.route.stale ? `${w.route.from ? w.route.from + ' → ' : '→ '}${w.route.to}` : '';
  return tip(aircraftName(w, p.callsign), dest, [alt, t].filter(Boolean).join('  '), motion, `${fmt(p.t)} (${p.source})`);
}

// An aeroplane silhouette (Material "airplanemode_active", nose up), turned to the track.
const PLANE_PATH = 'M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';
function planeIcon(track, {fill = '#c00', opacity = 1} = {}) {
  const deg = Number.isFinite(Number(track)) ? Number(track) : 0;
  return L.divIcon({
    className: 'plane', iconSize: [30, 30], iconAnchor: [15, 15],
    html: `<svg viewBox="0 0 24 24" width="30" height="30" style="transform: rotate(${deg}deg); opacity: ${Number(opacity)}">` +
          `<path d="${PLANE_PATH}" fill="${fill}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>`,
  });
}

// How the tracked aircraft is named in a tooltip: its registration first, then the flight it is
// operating, then its type; the hex only if we know nothing else.
function aircraftName(w, callsign, withType = true) {
  const flight = callsign || w.callsign || (w.flight && w.flight.callsign);
  return [w.tail, flight, withType ? w.type : ''].filter(Boolean).join(' · ') || w.hex;
}

// ---- waypoints named in CPDLC position reports -----------------------------
function wptIcon(exact) {
  return L.divIcon({className: 'wpt-wrap', iconSize: [14, 14], iconAnchor: [7, 7], html: `<div class="wpt${exact ? '' : ' est'}"></div>`});
}
const ROLE_TEXT = {passed: w => `passed${w.t ? ' ' + fmtTime(w.t) : ''}${w.alt_ft ? ' at ' + num(w.alt_ft) + ' ft' : ''}`,
                   next: w => `next fix${w.t ? ', ETA ' + fmtTime(w.t) : ''}`, then: () => 'fix after next'};
// One marker per name: an exact position beats an estimate, and among equals the newest report wins.
function drawWaypoints(msgs) {
  const best = new Map();
  for (const m of msgs) {
    if (m.suspect) continue;
    const mt = new Date(m.pos_t || m.t).getTime();
    for (const wp of m.waypoints || []) {
      const cur = best.get(wp.name);
      if (!cur || (wp.exact && !cur.wp.exact) || (wp.exact === cur.wp.exact && mt >= cur.mt)) best.set(wp.name, {wp, mt, m});
    }
  }
  for (const {wp, m} of best.values()) {
    L.marker(ll(wp.lat, wp.lon), {icon: wptIcon(wp.exact), zIndexOffset: 500}).addTo(wptGroup)
      .on('click', () => pickMessage(m.id))
      .bindTooltip(tip(`${wp.name} \u2014 ${(ROLE_TEXT[wp.role] || (() => wp.role))(wp)}`,
        wp.exact ? wp.how : '\u26a0 ' + wp.how, `named in the ${m.kind} report of ${fmt(m.pos_t || m.t)}`));
  }
}

// ---- projection: where the aircraft probably is now, and a little further ahead --------------
// Dead reckoning from the newest trustworthy fix, along its track at its ground speed. It is only
// an estimate, so it is limited: not from a fix over an hour old, never more than 90 minutes beyond
// the fix, not for an aircraft on the ground or too slow to be flying, and not past a known destination.
const PROJ = {maxFixAgeMin: 60, maxSpanMin: 90, minGs: 100, maxGs: 700, tickMin: 10, ghostAfterSec: 45, destSlackDeg: 35};
let aheadMin = 30, lastData = null;
try { const v = localStorage.getItem('aheadMin'); if (['0', '15', '30', '60'].includes(v)) aheadMin = Number(v); } catch (e) { /* no storage: keep the default */ }
const RAD = Math.PI / 180;
function advance(lat, lon, trk, nm) {
  const a = trk * RAD, nlat = lat + nm * Math.cos(a) / 60;
  return [nlat, lon + nm * Math.sin(a) / (60 * Math.cos((lat + nlat) / 2 * RAD))];
}
const wrap180 = d => ((d % 360) + 540) % 360 - 180;
function bearingTo(lat1, lon1, lat2, lon2) {
  return (Math.atan2(wrap180(lon2 - lon1) * Math.cos((lat1 + lat2) / 2 * RAD), lat2 - lat1) / RAD + 360) % 360;
}
const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
// The destination to stop at: the one you set, else what the aircraft reported if that is recent.
function destOf(w) {
  if (w.dest_lat != null) return {lat: w.dest_lat, lon: w.dest_lon, code: w.dest};
  if (w.route && !w.route.stale && w.route.to_lat != null) return {lat: w.route.to_lat, lon: w.route.to_lon, code: w.route.to};
  return null;
}

function projection(w, pts, msgs, nowMs, ahead = aheadMin) {
  if (!ahead) return null;
  const cands = [
    ...pts.map(p => ({lat: p.lat, lon: p.lon, t: Date.parse(p.t), gs: p.gs, trk: p.track, ground: !!p.on_ground, src: p.source || 'ADS-B'})),
    ...msgs.filter(m => m.lat != null && !m.suspect && !m.time_unverified).map(m =>
      ({lat: m.lat, lon: m.lon, t: Date.parse(m.pos_t || m.t), gs: m.gs, trk: m.trk, ground: false, src: SOURCES[m.kind] ? SOURCES[m.kind].name : m.kind})),
  ].sort((a, b) => a.t - b.t);
  const L0 = cands[cands.length - 1];
  if (!L0 || L0.ground) return null;
  const ageMin = (nowMs - L0.t) / 60000;
  if (ageMin > PROJ.maxFixAgeMin || ageMin < -2) return null;
  let gs = L0.gs, trk = L0.trk, basis = `its reported ${Math.round(L0.gs)} kt on track ${Math.round(L0.trk)}°`;
  if (gs == null || trk == null) {
    // The fix gave no speed or track: take them from the move since the previous fix.
    const P = [...cands].reverse().find(c => c !== L0 && L0.t - c.t >= 60000 && L0.t - c.t <= 45 * 60000);
    if (!P) return null;
    gs = distNM(P.lat, P.lon, L0.lat, L0.lon) / ((L0.t - P.t) / 3600000);
    trk = bearingTo(P.lat, P.lon, L0.lat, L0.lon);
    basis = `${Math.round(gs)} kt on track ${Math.round(trk)}°, from the move since the ${P.src} fix ${Math.round((L0.t - P.t) / 60000)} min earlier`;
  }
  if (!(gs >= PROJ.minGs && gs <= PROJ.maxGs)) return null;
  const endMin = Math.min(ageMin + ahead, PROJ.maxSpanMin);   // minutes after the fix at the far end
  let nowNm = gs * Math.max(ageMin, 0) / 60, endNm = gs * endMin / 60, stop = null;
  const dest = destOf(w);
  if (dest) {
    const dd = distNM(L0.lat, L0.lon, dest.lat, dest.lon);
    if (angDiff(bearingTo(L0.lat, L0.lon, dest.lat, dest.lon), trk) <= PROJ.destSlackDeg && dd < endNm) {
      endNm = dd; nowNm = Math.min(nowNm, dd); stop = dest.code;     // it would arrive: do not fly it past
    }
  }
  const ticks = [];
  for (let k = 1; ageMin + k * PROJ.tickMin <= endMin; k++) {
    const nm = gs * (ageMin + k * PROJ.tickMin) / 60;
    if (nm > endNm) break;                         // beyond the destination: not drawn
    const [la, lo] = advance(L0.lat, L0.lon, trk, nm);
    ticks.push({lat: la, lon: lo, min: k * PROJ.tickMin});
  }
  return {fix: L0, ageMin, gs, trk, basis, stop, now: advance(L0.lat, L0.lon, trk, nowNm), end: advance(L0.lat, L0.lon, trk, endNm), ticks,
          endMin: endMin - Math.max(ageMin, 0), capped: ageMin + ahead > PROJ.maxSpanMin};
}

function drawProjection() {
  projGroup.clearLayers();
  if (!lastData) return;
  const p = projection(lastData.w, lastData.pts, lastData.msgs, Date.now());
  if (!p) return;
  const f = p.fix, line = {color: '#555', weight: 2, interactive: false};
  const showGhost = p.ageMin * 60 >= PROJ.ghostAfterSec;
  if (showGhost) {
    L.polyline([ll(f.lat, f.lon), ll(...p.now)], {...line, dashArray: '2 6'}).addTo(projGroup);
    L.marker(ll(...p.now), {icon: planeIcon(p.trk, {fill: '#777', opacity: .55}), zIndexOffset: 900}).addTo(projGroup).bindTooltip(tip(
      `Estimated position now (${Math.round(p.ageMin)} min since the last fix)`, `dead reckoning from the ${f.src} fix at ${fmtTime(f.t)}`,
      p.basis, p.stop ? `stops at ${p.stop}` : '', 'error grows with every minute and a turn would make it wrong'));
  }
  L.polyline([showGhost ? ll(...p.now) : ll(f.lat, f.lon), ll(...p.end)], {...line, dashArray: '2 10', opacity: .65}).addTo(projGroup);
  for (const t of p.ticks) {
    L.circleMarker(ll(t.lat, t.lon), {radius: 3, color: '#555', weight: 1, fillColor: '#fff', fillOpacity: 1}).addTo(projGroup)
      .bindTooltip(tip(`+${t.min} min (estimate)`, p.basis));
  }
  L.circleMarker(ll(...p.end), {radius: 4, color: '#555', weight: 2, fillColor: '#ddd', fillOpacity: 1}).addTo(projGroup).bindTooltip(tip(
    p.stop ? `Projection stops at the destination, ${p.stop}` : `End of the projection (+${Math.round(p.endMin)} min)`,
    p.capped ? 'limited to 90 minutes from the last fix' : '', p.basis));
}

const markers = new Map();   // message id -> its marker on the map
let showSeq = 0;             // discards the result of a slower, superseded request
function distNM(lat1, lon1, lat2, lon2) {
  const r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * 3440.065 * Math.asin(Math.sqrt(h));
}

// Split fixes (any order) into tracks: sorted by time, broken wherever the aircraft was silent for longer
// than maxGapMin or the move to the next fix is impossible (over 700 kt). A lone fix draws no line.
function segments(fixes, maxGapMin) {
  const sorted = fixes.slice().sort((a, b) => a.t - b.t);
  const out = [];
  let cur = [];
  for (const f of sorted) {
    const p = cur[cur.length - 1];
    if (p) {
      const dt = f.t - p.t, d = distNM(p.lat, p.lon, f.lat, f.lon);
      const impossible = dt <= 0 ? d > 20 : d / (dt / 3600000) > 700;
      if (dt > maxGapMin * 60000 || impossible) { out.push(cur); cur = []; }
    }
    cur.push(f);
  }
  out.push(cur);
  return out.filter(seg => seg.length >= 2);
}

const FOCUS_ZOOM = 7;   // regional: a few hundred miles across

// The newest position we hold for an aircraft, from ADS-B or from a message. Trustworthy ones come
// first: a position flagged impossible, or one whose time is unverified, only counts if nothing
// better exists, so it cannot win just by claiming to be recent.
function latestFix(pts, msgs) {
  const all = [
    ...pts.map(p => ({lat: p.lat, lon: p.lon, t: new Date(p.t).getTime(), tier: 1, src: p.source})),
    ...msgs.filter(m => m.lat != null).map(m => ({lat: m.lat, lon: m.lon, t: new Date(m.pos_t || m.t).getTime(),
      tier: m.suspect ? 3 : m.time_unverified ? 2 : 1, src: m.kind})),
  ];
  if (!all.length) return null;
  const best = Math.min(...all.map(f => f.tier));
  return all.filter(f => f.tier === best).reduce((a, b) => (b.t > a.t ? b : a));
}

async function showTrack(w, focus) {
  if (!w.hex) { layer.clearLayers(); wptGroup.clearLayers(); lastData = null; drawProjection(); markers.clear(); renderMessages([]); return; }
  const seq = ++showSeq;
  const [pts, msgs] = await Promise.all([api(`/api/track/${w.hex}?hours=96`), api(`/api/messages/${w.hex}?hours=96`)]);
  if (seq !== showSeq) return;
  if (focus || lonRef === null) { const f0 = latestFix(pts, msgs); lonRef = f0 ? f0.lon : (lonRef ?? 0); }
  layer.clearLayers();
  Object.values(SOURCES).forEach(src => src.group.clearLayers());
  wptGroup.clearLayers();
  markers.clear();

  // A track per source. Lines run through each source's positions in time order, skipping ones flagged impossible.
  const drawTrack = (key, fixes) => {
    const src = SOURCES[key];
    for (const seg of segments(fixes, src.gapMin)) {
      for (const part of trackParts(seg)) {
        L.polyline(part, {color: src.color, weight: src.weight, dashArray: src.dash, opacity: .9}).addTo(src.group);
      }
    }
  };
  drawTrack('adsb', pts.map(p => ({lat: p.lat, lon: p.lon, t: new Date(p.t).getTime()})));

  // Positions reported inside messages: a dot in the source's colour (grey if impossible, faint and dotted if
  // their time is unverified), and a track through them.
  const byKind = {};
  for (const m of msgs) {
    if (m.lat == null) continue;
    const src = SOURCES[m.kind];
    const mk = L.circleMarker(ll(m.lat, m.lon), {
      radius: 4, weight: 1, color: m.suspect ? '#888' : (src ? src.color : '#e8590c'),
      fillOpacity: m.time_unverified ? .2 : .8, dashArray: m.time_unverified ? '2 2' : null,
    }).addTo(src ? src.group : layer);
    mk.bindTooltip(tip(m.summary, fmt(m.pos_t || m.t), motionLine(m), wxLine(m), m.suspect ? '⚠ ' + m.suspect : '', m.time_unverified ? '⏱ time unverified' : ''));
    mk.on('click', () => pickMessage(m.id));   // clicking a dot selects its message in the list
    markers.set(m.id, mk);
    if (src && !m.suspect) (byKind[m.kind] ||= []).push({lat: m.lat, lon: m.lon, t: new Date(m.pos_t || m.t).getTime()});
  }
  for (const [kind, fixes] of Object.entries(byKind)) drawTrack(kind, fixes);
  drawWaypoints(msgs);

  // Predicted route from the newest ADS-C report that has one.
  const withRoute = msgs.filter(m => m.route && m.lat != null && !m.suspect).pop();
  if (withRoute) {
    const line = [ll(withRoute.lat, withRoute.lon), ...withRoute.route.map(p => ll(p.Lat, p.Lon))];
    L.polyline(line, {color: SOURCES.adsc.color, weight: 2, dashArray: '6 6'}).addTo(SOURCES.adsc.group);
    withRoute.route.forEach(p => L.circleMarker(ll(p.Lat, p.Lon), {radius: 3, color: SOURCES.adsc.color, fillColor: '#fff', fillOpacity: 1}).addTo(SOURCES.adsc.group)
      .bindTooltip(tip('predicted waypoint', p.ETASec != null ? `ETA +${Math.round(p.ETASec / 60)} min from ${fmt(withRoute.pos_t || withRoute.t)}` : '')));
  }

  // The aircraft: a plane at its last ADS-B position, turned to its track. With no ADS-B
  // (mid-ocean), the newest trustworthy message position, pointing north.
  if (pts.length) {
    const last = pts[pts.length - 1];
    L.marker(ll(last.lat, last.lon), {icon: planeIcon(last.track), zIndexOffset: 1000}).addTo(layer)
      .bindTooltip(aircraftTip(w, pts));
  } else {
    const fix = latestFix([], msgs.filter(m => !m.suspect && !m.time_unverified));
    const m = fix && msgs.find(x => x.lat === fix.lat && x.lon === fix.lon && new Date(x.pos_t || x.t).getTime() === fix.t);
    if (fix && m) {
      L.marker(ll(fix.lat, fix.lon), {icon: planeIcon(null), zIndexOffset: 1000}).addTo(layer)
        .bindTooltip(tip(`${aircraftName(w, null, false)}: last reported position`, m.summary, fmt(m.pos_t || m.t)));
    }
  }

  lastData = {w, pts, msgs};
  drawProjection();
  renderMessages(msgs);
  applyHighlight();
  // Choosing a target: centre and zoom on its newest fix. (A refresh leaves the view alone.)
  if (focus) {
    const f = latestFix(pts, msgs);
    if (f) map.setView(ll(f.lat, f.lon), FOCUS_ZOOM);
  }
}

// ---- message list ---------------------------------------------------------
// A position message is listed at the time the report itself carries, which can differ from when
// airframes.io logged it (this station's messages arrive about 3 minutes before the time inside them).
const reportTime = m => (m.lat != null && m.pos_t) ? m.pos_t : m.t;
function dur(sec) {
  if (sec >= 3600) return `${Math.floor(sec / 3600)}h${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}m`;
  return `${Math.floor(sec / 60)}m${String(sec % 60).padStart(2, '0')}s`;
}

let showUndecoded = false, lastMsgs = [], selectedMsg = null;
// A dot or waypoint on the map was clicked: select its message in the list and bring it into view.
function pickMessage(id) {
  selectedMsg = id;
  applyHighlight(false);
  const row = rows.get(id);
  if (row && row.scrollIntoView) row.scrollIntoView({block: 'nearest'});
}
const expanded = new Set();   // message ids whose details are open; survives refreshes
const rows = new Map();       // message id -> its row

// Ring the selected message's position and show just its popup, panning only if it is out of view.
function applyHighlight(pan) {
  map.eachLayer(l => { if (l.closeTooltip) l.closeTooltip(); });   // no stray popups from earlier clicks
  highlight.clearLayers();
  rows.forEach((el, id) => el.classList.toggle('sel', id === selectedMsg));
  const m = lastMsgs.find(x => x.id === selectedMsg);
  if (!m || m.lat == null) return;
  L.circleMarker(ll(m.lat, m.lon), {radius: 13, color: '#0a58ca', weight: 3, fillColor: '#ffd43b', fillOpacity: .35, interactive: false}).addTo(highlight);
  if (pan && !map.getBounds().pad(-0.1).contains(ll(m.lat, m.lon))) map.panTo(ll(m.lat, m.lon));
  const mk = markers.get(m.id);
  const src = SOURCES[m.kind];
  if (src && !map.hasLayer(src.group)) map.addLayer(src.group);   // it was switched off in the legend
  if (mk) mk.openTooltip();
}

function renderMessages(msgs) {
  lastMsgs = msgs;
  rows.clear();
  const box = $('#msgs');
  if (!msgs.length) { box.innerHTML = '<div class="empty">No messages yet.</div>'; return; }
  const hidden = msgs.filter(m => m.undecoded).length;
  const shown = showUndecoded ? msgs : msgs.filter(m => !m.undecoded);
  const toggle = document.createElement('div');
  toggle.className = 'empty';
  if (hidden) {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = showUndecoded ? `hide ${hidden} undecoded` : `show ${hidden} undecoded`;
    a.onclick = e => { e.preventDefault(); showUndecoded = !showUndecoded; renderMessages(lastMsgs); applyHighlight(); };
    toggle.append(a, document.createTextNode(' (airline-specific data and message fragments)'));
  }
  box.replaceChildren(...(hidden ? [toggle] : []), ...shown.slice().sort((a, b) => new Date(reportTime(b)) - new Date(reportTime(a)) || b.id - a.id).map(m => {
    const d = document.createElement('div');
    d.className = 'msg' + (m.lat != null ? ' hasloc' : '');
    const t = document.createElement('time');
    const rt = reportTime(m);
    t.textContent = new Date(rt).toISOString().slice(5, 19).replace('T', ' ') + 'Z';
    if (rt !== m.t) t.className = 'rt';   // dotted underline: this is the report time, not the arrival time
    t.onmouseenter = () => {              // computed on hover so it is never stale
      if (rt === m.t) { t.title = ago(m.t); return; }
      const lag = Math.round((new Date(rt) - new Date(m.t)) / 1000);
      t.title = [ago(rt), `report time ${fmtTime(rt)}`, `arrived ${fmtTime(m.t)}` +
        (Math.abs(lag) >= 60 ? ` (report is ${dur(Math.abs(lag))} ${lag > 0 ? 'after' : 'before'} arrival)` : '')].join('\n');
    };
    const k = document.createElement('span');
    k.className = 'kind';
    k.textContent = m.kind.replace('_', ' ');
    d.append(t, k, document.createTextNode(m.summary));
    for (const [flag, why] of [['⚠', m.mismatch], ['?', m.suspect], ['⏱', m.time_unverified && m.time_note]]) {
      if (!why) continue;
      const w = document.createElement('span');
      w.className = 'warn'; w.textContent = flag; w.title = why;
      d.append(w);
    }
    const pre = document.createElement('pre');
    pre.hidden = !expanded.has(m.id);
    pre.textContent = [m.detail && m.detail !== m.summary ? m.detail : '',
      m.mismatch ? 'airframes.io disagrees: ' + m.mismatch : '', m.suspect ? 'position suspect: ' + m.suspect : '',
      m.time_note ? 'time: ' + m.time_note : '',
      `label ${m.label}${m.dir ? ', ' + m.dir : ''}${m.station ? ', ' + m.station : ''}${m.rx_count > 1 ? `, heard ${m.rx_count}x` : ''}`,
      'raw: ' + m.raw].filter(Boolean).join('\n\n');
    d.append(pre);
    d.onclick = () => {
      pre.hidden = !pre.hidden;
      pre.hidden ? expanded.delete(m.id) : expanded.add(m.id);
      selectedMsg = m.id;
      applyHighlight(true);
    };
    rows.set(m.id, d);
    return d;
  }));
}

$('#add').onsubmit = async e => {
  e.preventDefault();
  $('#err').textContent = '';
  const f = new FormData(e.target), body = {input: f.get('input')};
  if (f.get('until')) body.until = new Date(f.get('until')).toISOString();
  try {
    await api('/api/watches', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    e.target.reset();
    refresh();
  } catch (err) { $('#err').textContent = err.message; }
};

function setAhead(v) {
  aheadMin = v;
  try { localStorage.setItem('aheadMin', String(v)); } catch (e) { /* not saved: fine */ }
  drawProjection();
}
{
  const sel = $('#ahead');
  sel.value = String(aheadMin);
  sel.onchange = () => setAhead(Number(sel.value) || 0);
}
setInterval(drawProjection, 5000);   // the estimate moves with the clock, between 30 s refreshes

function tick() { $('#clock').textContent = new Date().toISOString().slice(0, 19).replace('T', ' ') + 'Z'; }
tick();
setInterval(tick, 1000);

refresh();
// Every 30 s: update the list and redraw the selected aircraft, leaving the map view,
// the highlight and any open message details alone.
setInterval(async () => {
  try {
    await refresh();
    const w = watches.find(x => x.id === selected);
    if (w) await showTrack(w, false);
  } catch (e) { /* transient: try again next tick */ }
}, 30000);
</script>
</body>
