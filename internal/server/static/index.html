  // A plane standing on a report is that report: clicking it selects the message.
  const cur = current ? latestFix(pts, msgs) : null;
  if (cur && cur.kind === 'adsb') {
    placePlane(cur.lat, cur.lon, cur.ref.track, cur.t, !!w.landing).bindTooltip(aircraftTip(w, pts, cur.t));
  } else if (cur) {
    const m = cur.ref;
    placePlane(m.lat, m.lon, m.trk, cur.t, !!w.landing)
      .bindTooltip(tip(`${aircraftName(w, null, false)}: last report`, ...flightLines(w), ...hoverSummary(m).lines, fmtAgo(m.pos_t || m.t), motionLine(m), hoverSummary(m).hasWx ? '' : wxLine(m), 'no newer ADS-B', fixNote(w, Date.now() - cur.t)))
      .on('click', () => pickMessage(m.id));
  }

  const plan = choosePlan(plans, chosen);
  drawPlan(plan);
  drawClearances(plans, chosen);
  trackCtx = {pts, msgs, chosen, plan};
  drawTrackLines();
  drawWindBarbs();
  lastData = current ? {w, pts, msgs, plan} : null;
  lastTrack = {pts, msgs};
  drawProjection();
  renderMessages(msgs);
  applyHighlight();
  // Choosing a target: centre and zoom on its newest fix. (A refresh leaves the view alone.)
  if (focus === 'flight') {
    const pointsOf = [...pts.map(p => ll(p.lat, p.lon)), ...msgs.filter(m => m.lat != null && !m.suspect).map(m => ll(m.lat, m.lon))];
    if (pointsOf.length) map.fitBounds(pointsOf, {maxZoom: 8, padding: [30, 30]});
  } else if (focus) {
    const f = latestFix(pts, msgs);
    if (f) map.setView(ll(f.lat, f.lon), FOCUS_ZOOM);
  }
}

// ---- message list ---------------------------------------------------------
// A position message is listed at the time the report itself carries, which can differ from when
// airframes.io logged it (this station's messages arrive about 3 minutes before the time inside them).
const reportTime = m => (m.lat != null && m.pos_t) ? m.pos_t : (m.at || m.t);   // (at: a message delivered late counts from when it was sent)
// An ADS-C report gives its predicted waypoints as coordinates; where we know their names, say so.
function routeNames(m) {
  const named = (m.route || []).filter(p => p.kind !== 'fixed' && p.name);
  return named.length ? ' \u00b7 ' + named.map(p => (p.kind === 'next' ? 'next ' : 'then ') + p.name).join(', ') : '';
}
function dur(sec) {
  if (sec >= 3600) return `${Math.floor(sec / 3600)}h${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}m`;
  return `${Math.floor(sec / 60)}m${String(sec % 60).padStart(2, '0')}s`;
}

// ---- what a report predicted --------------------------------------------------------------
// An ADS-C report lists the waypoints it expects to reach (with ETAs) and where the flight computer
// expects to be after a fixed time; a CPDLC position report names the next fixes. Selecting such a
// report draws them; selecting any other point replaces them. With nothing selected, the newest ADS-C
// report's route is shown.
const etaText = (m, secs) => secs == null ? '' : `ETA ${fmtTime(new Date(m.pos_t || m.t).getTime() + secs * 1000)} (+${Math.round(secs / 60)} min)`;
function drawPredictions() {
  predGroup.clearLayers();
  // A selection that is no longer in the list (it scrolled out of the window, or another aircraft was chosen) is no selection.
  const m = (selectedMsg != null && lastMsgs.find(x => x.id === selectedMsg))
            || lastMsgs.filter(x => x.route && x.route.length && x.lat != null && !x.suspect).pop();
  if (!m || m.lat == null) return;
  const here = ll(m.lat, m.lon);
  const route = (m.route || []).filter(p => p.kind !== 'fixed');
  if (route.length) {
    const c = SOURCES.adsc.color;
    L.polyline([here, ...route.map(p => ll(p.lat, p.lon))], {color: c, weight: 2, dashArray: '6 6', interactive: false}).addTo(predGroup);
    for (const p of route) {
      L.circleMarker(ll(p.lat, p.lon), {radius: 5, color: c, weight: 2, fillColor: '#fff', fillOpacity: 1}).addTo(predGroup).bindTooltip(tip(
        `${p.name ? p.name + ' \u2014 ' : ''}predicted ${p.kind === 'next' ? 'next waypoint' : 'waypoint after next'}`, etaText(m, p.eta_sec),
        p.name ? (p.name_src === 'learned' ? 'name from nav db (learned)' : 'name from nav db (2013 src)') : '(coordinates only)',
        `predicted by the report of ${fmtAgo(m.pos_t || m.t)}`));
    }
  }
  const proj = (m.route || []).find(p => p.kind === 'fixed');
  if (proj) {
    L.circleMarker(ll(proj.lat, proj.lon), {radius: 5, color: SOURCES.adsc.color, weight: 2, fillColor: SOURCES.adsc.color, fillOpacity: .35}).addTo(predGroup).bindTooltip(tip(
      `FMS forecast${proj.eta_sec != null ? ' in ' + Math.round(proj.eta_sec / 60) + ' min' : ''}`, etaText(m, proj.eta_sec),
      `predicted by the report of ${fmtAgo(m.pos_t || m.t)}`));
  }
  const ahead = (m.waypoints || []).filter(w => w.role !== 'passed');
  if (ahead.length) {
    const c = SOURCES.cpdlc.color;
    L.polyline([here, ...ahead.map(w => ll(w.lat, w.lon))], {color: c, weight: 2, dashArray: '6 6', interactive: false}).addTo(predGroup);
    for (const w of ahead) {
      L.circleMarker(ll(w.lat, w.lon), {radius: 9, color: c, weight: 2, fillOpacity: 0}).addTo(predGroup).bindTooltip(tip(
        `${w.name} \u2014 ${(ROLE_TEXT[w.role] || (() => w.role))(w)}`, w.exact ? w.how : '\u26a0 ' + w.how, `${m.kind} report of ${fmtAgo(m.pos_t || m.t)}`));
    }
  }
}

let showUndecoded = false, lastMsgs = [], selectedMsg = null;
// A dot or waypoint on the map was clicked: select its message in the list and bring it into view.
function pickMessage(id) {
  if (!accOpen.msgs) setAcc('msgs', true);   // choosing a message on the map shows it in the list
  const m = lastMsgs.find(x => x.id === id);
  if (m && m.part_of) id = m.part_of;        // a block or copy has no row: its whole message does
  selectedMsg = id;
  applyHighlight(false);
  const row = rows.get(id);
  if (row && row.scrollIntoView) row.scrollIntoView({block: 'nearest'});
}
const expanded = new Set();   // message ids whose details are open; survives refreshes
const rows = new Map();       // message id -> its row

// Ring the selected message's position and show just its popup, panning only if it is out of view.
function applyHighlight(pan) {
  map.eachLayer(l => { if (l.closeTooltip) l.closeTooltip(); });   // no stray popups from earlier clicks
  highlight.clearLayers();
  drawPredictions();                                               // the selected report's predictions, replacing the last one's
  drawWaypoints(lastMsgs.find(x => x.id === selectedMsg));         // and the fixes it named
  rows.forEach((el, id) => el.classList.toggle('sel', id === selectedMsg));
  const m = lastMsgs.find(x => x.id === selectedMsg);
  if (!m) { atisFitFor = null; return; }
  if (m.airports && m.airports.length) drawAtisAirports(m, highlight);   // the airports a D-ATIS message asked about
  else atisFitFor = null;
  if (m.lat == null) { drawGhost(m, pan); return; }   // no position of its own: a ghost where the flight path puts it
  L.circleMarker(ll(m.lat, m.lon), {radius: 13, color: '#0a58ca', weight: 3, fillColor: '#ffd43b', fillOpacity: .35, interactive: false}).addTo(highlight);
  if (pan && !map.getBounds().pad(-0.1).contains(ll(m.lat, m.lon))) map.panTo(ll(m.lat, m.lon));
  const mk = markers.get(m.id);
  const src = SOURCES[m.kind];
  if (src && !map.hasLayer(src.group)) map.addLayer(src.group);   // it was switched off in the legend
  if (mk) mk.openTooltip();
}

// A heading above each flight's messages (all-flights view) or above the one chosen.
function flightHeader(i) {
  const d = document.createElement('div');
  if (i < 0) {
    d.className = 'fhead none';
    d.textContent = 'not matched to a flight';
    return d;
  }
  const sg = flightSegs[i];
  d.className = 'fhead';
  d.textContent = `${segLabel(sg)} \u00b7 ${sg.messages} msgs`;
  d.title = `${fmt(sg.start)} to ${fmt(sg.end)}${sg.latest ? ' (most recent)' : ''}`;
  d.onclick = () => chooseFlight(sg.id);
  return d;
}

function renderMessages(msgs) {
  lastMsgs = msgs;
  rows.clear();
  const box = $('#msgs');
  // A block of a longer message, or a shorter copy of it, is listed under the whole message (the map still marks every one).
  const whole = msgs.filter(m => !m.part_of);
  $('#msgcount').textContent = whole.length ? `(${whole.length})` : '';
  if (!msgs.length) { box.innerHTML = '<div class="empty">No messages yet.</div>'; return; }
  const hidden = whole.filter(m => m.undecoded).length;
  const shown = showUndecoded ? whole : whole.filter(m => !m.undecoded);
  const toggle = document.createElement('div');
  toggle.className = 'empty';
  if (hidden) {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = showUndecoded ? `hide ${hidden} undecoded` : `show ${hidden} undecoded`;
    a.onclick = e => { e.preventDefault(); showUndecoded = !showUndecoded; renderMessages(lastMsgs); applyHighlight(); };
    toggle.append(a, document.createTextNode(' (airline-specific data and message fragments)'));
  }
  const sorted = shown.slice().sort((a, b) => new Date(reportTime(b)) - new Date(reportTime(a)) || b.id - a.id);
  const only = chosenFlight();
  let lastSeg;   // headings: one above everything for a chosen flight, one per flight in the all view
  const withHeaders = (rows) => flightSegs.length === 0 ? rows : only ? [flightHeader(flightSegs.indexOf(only)), ...rows] : rows.flatMap((row, k) => {
    const i = segOf(Date.parse(reportTime(sorted[k])));
    if (k > 0 && i === lastSeg) return [row];
    lastSeg = i;
    return [flightHeader(i), row];
  });
  box.replaceChildren(...(hidden ? [toggle] : []), ...withHeaders(sorted.map(m => {
    const d = document.createElement('div');
    d.className = 'msg' + (m.lat != null ? ' hasloc' : '') + (m.elsewhere ? ' elsewhere' : '');
    const t = document.createElement('time');
    const rt = reportTime(m);
    t.textContent = new Date(rt).toISOString().slice(5, 19).replace('T', ' ') + 'Z';
    if (rt !== m.t) t.className = 'rt';   // dotted underline: this is the report time, not the arrival time
    t.onmouseenter = () => {              // computed on hover so it is never stale
      if (rt === m.t) { t.title = ago(m.t); return; }
      const lag = Math.round((new Date(rt) - new Date(m.t)) / 1000);
      t.title = [ago(rt), `report time ${fmtTime(rt)}`, `arrived ${fmtTime(m.t)}` +
        (Math.abs(lag) >= 60 ? ` (report is ${dur(Math.abs(lag))} ${lag > 0 ? 'after' : 'before'} arrival)` : '')].join('\n');
    };
    const k = document.createElement('span');
    k.className = 'kind';
    k.textContent = m.kind.replace('_', ' ');
    d.append(t, k, document.createTextNode(m.summary + routeNames(m)));
    if (m.elsewhere) {
      const c = document.createElement('span');
      c.className = 'elsechip';
      c.textContent = `\u2192 ${m.elsewhere.flight}`;
      c.title = `airframes.io tagged this message with ${m.elsewhere.flight}, an earlier flight of this aircraft, so it probably belongs there: delivered late by a ground station, or sent before the flight number was changed`;
      d.append(c);
    }
    if (m.parts && m.parts.length) {
      const c = document.createElement('span');
      c.className = 'partchip';
      c.textContent = `+${m.parts.length} part${m.parts.length === 1 ? '' : 's'}`;
      c.title = 'also received as ' + m.parts.map(x => `${fmtTime(x.t)} (label ${x.label})`).join(', ');
      d.append(c);
    }
    for (const [flag, why] of [['⚠', m.mismatch], ['?', m.suspect], ['⏱', m.time_unverified && m.time_note]]) {
      if (!why) continue;
      const w = document.createElement('span');
      w.className = 'warn'; w.textContent = flag; w.title = why;
      d.append(w);
    }
    const pre = document.createElement('pre');
    pre.hidden = !expanded.has(m.id);
    pre.textContent = [m.detail && m.detail !== m.summary ? m.detail : '',
      m.mismatch ? 'airframes.io disagrees: ' + m.mismatch : '', m.suspect ? 'position suspect: ' + m.suspect : '',
      m.time_note ? 'time: ' + m.time_note : '',
      `label ${m.label}${m.dir ? ', ' + m.dir : ''}${m.station ? ', ' + m.station : ''}${m.rx_count > 1 ? `, heard ${m.rx_count}x` : ''}`,
      m.parts && m.parts.length ? `also received as ${m.parts.length} shorter ${m.parts.length === 1 ? 'copy or block' : 'copies or blocks'}: ${m.parts.map(x => fmtTime(x.t)).join(', ')}` : '',
      'raw: ' + m.raw].filter(Boolean).join('\n\n');
    d.append(pre);
    d.onclick = () => {
      pre.hidden = !pre.hidden;
      pre.hidden ? expanded.delete(m.id) : expanded.add(m.id);
      selectedMsg = m.id;
      applyHighlight(true);
    };
    rows.set(m.id, d);
    return d;
  })));
}

// Say how a new watch was read, and how to say otherwise.
function readAs(w, typed) {
  if (w.result === 'existing') return `Already watching ${w.ident}.`;   // nothing new was added
  if (w.result === 'reopened') return `Watching ${w.ident} again.`;
  const explicit = /^\s*[a-z]+:/i.test(typed);
  const hint = explicit ? '' : kind => ` For ${kind}, enter ${kind === 'a registration' ? 'tail' : kind === 'a callsign' ? 'flight' : 'hex'}:${w.ident}.`;
  if (w.kind === 'flight') return w.date ? `Watching ${w.ident} on ${w.date} as a flight number.` : `Watching ${w.ident} as a callsign.${explicit ? '' : hint('a registration')}`;
  if (w.kind === 'hex') return `Watching ${w.ident} as an ICAO hex address.${explicit ? '' : hint('a callsign')}`;
  return `Watching ${w.ident} as a registration.${explicit ? '' : hint('a callsign')}`;
}

$('#add').onsubmit = async e => {

  const sel = $('#flightsel');
  sel.onchange = () => chooseFlight(sel.value);
}
function setAhead(v) {

  try { localStorage.setItem('aheadMin', String(v)); } catch (e) { /* not saved: fine */ }
  drawProjection();
}

// ---- accordion -------------------------------------------------------------------------------
// The Watches tab is Targets above Messages. Each folds away (the other then takes the height) and the choice is kept.
const accOpen = {targets: true, msgs: true};
function setAcc(name, open, save = true) {
  accOpen[name] = open;
  $('#acc-' + name).classList.toggle('open', open);
  $('#chev-' + name).textContent = open ? '\u25be' : '\u25b8';
  $('#tab-watch').classList.toggle('msgs-closed', !accOpen.msgs);
  if (save) { try { localStorage.setItem('acc-' + name, open ? '1' : '0'); } catch (e) { /* not saved: fine */ } }
}
for (const name of ['targets', 'msgs']) {
  let open = true;
  try { open = localStorage.getItem('acc-' + name) !== '0'; } catch (e) { /* default: open */ }
  setAcc(name, open, false);
  $('#acchead-' + name).onclick = () => setAcc(name, !accOpen[name]);
}

// ---- fix search -----------------------------------------------------------------------------
// The waypoints we hold: positions learned from the aircraft's own messages, and the navigation
// database. The list is searched on the server; the one chosen is drawn here, in its own groups,
// which a refresh of the watches never clears.
const fixGroup = L.layerGroup().addTo(map);     // the fix chosen in the list, with others of the same name
const fixAllGroup = L.layerGroup().addTo(map);  // every learned fix, when asked for
const FIX_HOW = {'adsc-eta': 'ADS-C predicted ETA', 'adsc-chain': 'ADS-C route order', 'adsc-wpt': 'ADS-C waypoint event'};
let fixData = null, fixChosen = null, fixTimer = null, fixSeq = 0;
const fixKey = f => `${f.kind}|${f.name}|${f.lat.toFixed(3)}|${f.lon.toFixed(3)}`;
const nearLon = (lon, ref) => lon + 360 * Math.round((ref - lon) / 360);
const coord = f => `${Math.abs(f.lat).toFixed(3)}°${f.lat < 0 ? 'S' : 'N'} ${Math.abs(f.lon).toFixed(3)}°${f.lon < 0 ? 'W' : 'E'}`;

// What is known of a fix, one line each.
function fixLines(f) {
  const lines = [coord(f)];
  if (f.kind !== 'learned') {
    lines.push(`nav db (${fixData && fixData.database_cycle ? fixData.database_cycle.slice(0, 4) : 'downloaded'} src) · ${f.kind}`);
    return lines;
  }
  lines.push(`learned from ${f.n} message${f.n === 1 ? '' : 's'} · ${(f.sources || []).map(x => FIX_HOW[x] || x).join(', ')}`);
  if (f.first) lines.push(`first heard ${fmtAgo(f.first)}`, `last confirmed ${fmtAgo(f.last)}`);
  else lines.push('the messages that taught it are no longer stored');
  if (f.db_nm != null) lines.push(`nav db: ${f.db_nm < 0.1 ? 'same place' : f.db_nm.toFixed(1) + ' nm away'}`);
  else if (fixData && fixData.database_names) lines.push('not in nav db');
  return lines;
}

function fixTip(f) {
  const d = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = f.name;
  d.append(b);
  for (const l of fixLines(f)) { const e = document.createElement('div'); e.textContent = l; d.append(e); }
  return d;
}

function fixMarker(f, chosen) {
  const m = L.marker(ll2(f), {icon: L.divIcon({className: 'fixpin-wrap', iconSize: [18, 18], iconAnchor: [9, 9], html: `<div class="fixpin ${f.kind === 'learned' ? 'learned' : 'db'}"></div>`}),
                              zIndexOffset: chosen ? 1000 : 0});
  m.bindTooltip(fixTip(f), {direction: 'right', offset: [10, 0]});
  return m;
}
// A fix drawn one world over from the map's centre is hard to find: pick the copy nearest it.
function ll2(f) { return [f.lat, nearLon(f.lon, map.getCenter ? map.getCenter().lng : 0)]; }

// Draw a fix (and any other of the same name, which is a reused name) and move the map to it.
function showFix(f) {
  fixChosen = fixKey(f);
  fixGroup.clearLayers();
  for (const g of (fixData && fixData.fixes || []).filter(g => g.name === f.name)) {
    const chosen = fixKey(g) === fixChosen;
    fixMarker(g, chosen).addTo(fixGroup);
    if (chosen) {
      const el = fixTip(g);
      el.className = 'box';
      callout(fixGroup, ll2(g), 'fix:' + fixKey(g), el, {color: '#2b9348', z: 1000});
    }
  }
  map.setView(ll2(f), Math.max(map.getZoom ? map.getZoom() : 0, 6));
  renderFixes();
}

function renderFixes() {
  const ul = $('#fixlist');
  const all = fixData ? fixData.fixes : [];
  const learned = all.filter(f => f.kind === 'learned'), db = all.filter(f => f.kind !== 'learned');
  const by = $('#fixsort').value;
  if (by === 'last') learned.sort((a, b) => (b.last || '').localeCompare(a.last || ''));
  else if (by === 'n') learned.sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  const row = f => {
    const li = document.createElement('li');
    li.className = fixKey(f) === fixChosen ? 'sel' : '';
    const b = document.createElement('b');
    b.textContent = f.name;
    const chip = document.createElement('span');
    chip.className = 'kindchip ' + (f.kind === 'learned' ? 'learned' : '');
    chip.textContent = f.kind === 'learned' ? 'learned' : f.kind;
    li.append(b, chip);
    fixLines(f).forEach((l, i) => { const s = document.createElement('small'); s.textContent = l; if (i === 0) s.className = 'lastpos'; li.append(s); });
    li.onclick = () => showFix(f);
    return li;
  };
  const items = learned.map(row);
  if (db.length) {
    const sep = document.createElement('li');
    sep.className = 'sep';
    sep.textContent = `Navigation database${fixData.more ? ' (first ' + db.length + ')' : ''}`;
    items.push(sep, ...db.map(row));
  }
  if (!items.length) {
    const e = document.createElement('li');
    e.className = 'sep';
    e.textContent = $('#fixq').value.trim() ? 'No fix by that name.' : 'No fix has been learned yet.';
    items.push(e);
  }
  ul.replaceChildren(...items);
  if (fixData) {
    const nav = fixData.database_names ? `navigation database: ${fixData.database_names.toLocaleString()} names${fixData.database_cycle ? ', cycle ' + fixData.database_cycle : ''}`
                                       : 'no navigation database loaded';
    $('#fixstat').textContent = `${fixData.learned_names} fixes learned from messages (${fixData.learned_positions} positions) · ${nav}`;
  }
}

async function loadFixes() {
  const seq = ++fixSeq;
  try {
    const d = await api('/api/fixes?q=' + encodeURIComponent($('#fixq').value.trim()));
    if (seq !== fixSeq || !d) return;   // a newer search is under way
    fixData = d;
    $('#fixerr').textContent = '';
    renderFixes();
  } catch (e) { $('#fixerr').textContent = e.message; }
}

// Every learned fix as a small dot, if asked for; clicking one finds it in the list.
async function drawAllFixes() {
  fixAllGroup.clearLayers();
  if (!$('#fixall').checked) return;
  try {
    const d = await api('/api/fixes');
    if (!d || !$('#fixall').checked) return;
    for (const f of d.fixes) {
      const dot = L.circleMarker(ll2(f), {radius: 4, color: '#fff', weight: 1, fillColor: '#c2255c', fillOpacity: .85});
      dot.bindTooltip(fixTip(f));
      dot.on('click', () => { $('#fixq').value = f.name; loadFixes().then(() => showFix(f)); });
      dot.addTo(fixAllGroup);
    }
  } catch (e) { $('#fixerr').textContent = e.message; }
}

// ---- airport search -------------------------------------------------------------------------
// Airports by code, name or city (the server ranks them); with nothing typed, the ones your watches use.
// The one chosen is drawn with the 15 nm circle inside which a low, slow, silent aircraft is taken to have landed.
const airportGroup = L.layerGroup().addTo(map);
let airportData = null, airportChosen = null, airportTimer = null, airportSeq = 0;
const LANDING_RADIUS_NM = 15;
// Routes and aircraft popups give the four-letter ICAO code alone; the airport list, its search and the airport's own popup
// give both codes, which is where a reader learns what a route's code stands for.
const airportCodes = a => a.icao + (a.iata ? ' / ' + a.iata : '');

function airportLines(a) {
  const lines = [[a.name, a.city && !a.name.includes(a.city) ? a.city : ''].filter(Boolean).join(' · ')];
  lines.push(`${coord(a)}${a.elev_ft != null ? ' · ' + num(a.elev_ft) + ' ft' : ''}`);
  for (const w of a.why || []) lines.push(w);
  return lines;
}

function airportTip(a) {
  const d = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = airportCodes(a);
  d.append(b);
  for (const l of airportLines(a)) { const e = document.createElement('div'); e.textContent = l; d.append(e); }
  return d;
}

function showAirport(a) {
  airportChosen = a.icao;
  airportGroup.clearLayers();
  const at = ll2(a);
  L.circle(at, {radius: LANDING_RADIUS_NM * 1852, color: '#1d4ed8', weight: 1, dashArray: '4 6', fillOpacity: .04, interactive: false}).addTo(airportGroup);
  L.circleMarker(at, {radius: 7, color: '#fff', weight: 2, fillColor: '#1d4ed8', fillOpacity: 1}).addTo(airportGroup)
    .bindTooltip(airportTip(a), {direction: 'right', offset: [10, 0]});
  const el = airportTip(a);
  el.className = 'box';
  callout(airportGroup, at, 'apt:' + a.icao, el, {color: '#1d4ed8'});
  map.setView(at, Math.max(map.getZoom ? map.getZoom() : 0, 10));
  renderAirports();
}

function renderAirports() {
  const all = airportData ? airportData.airports : [];
  const items = all.map(a => {
    const li = document.createElement('li');
    li.className = a.icao === airportChosen ? 'sel' : '';
    const b = document.createElement('b');
    b.textContent = airportCodes(a);
    li.append(b);
    airportLines(a).forEach((l, i) => { const s = document.createElement('small'); s.textContent = l; if (i === 0) s.className = 'lastpos'; li.append(s); });
    li.onclick = () => showAirport(a);
    return li;
  });
  if (!items.length) {
    const e = document.createElement('li');
    e.className = 'sep';
    e.textContent = $('#aptq').value.trim() ? 'No airport matches.' : 'Type a code, name or city. (None of your watches use an airport yet.)';
    items.push(e);
  } else if (airportData.more) {
    const e = document.createElement('li');
    e.className = 'sep';
    e.textContent = `The first ${all.length}: type more to narrow it down.`;
    items.push(e);
  }
  $('#aptlist').replaceChildren(...items);
  if (airportData) {
    $('#aptstat').textContent = airportData.watched
      ? `Airports your watches use · ${airportData.total.toLocaleString()} airports to search`
      : `${all.length}${airportData.more ? '+' : ''} match${all.length === 1 ? '' : 'es'} of ${airportData.total.toLocaleString()} airports`;
  }
}

async function loadAirports() {
  const seq = ++airportSeq;
  try {
    const d = await api('/api/airports?q=' + encodeURIComponent($('#aptq').value.trim()));
    if (seq !== airportSeq || !d) return;   // a newer search is under way
    airportData = d;
    $('#apterr').textContent = '';
    renderAirports();
  } catch (e) { $('#apterr').textContent = e.message; }
}
$('#aptq').oninput = () => { clearTimeout(airportTimer); airportTimer = setTimeout(loadAirports, 200); };
$('#aptq').onkeydown = e => {   // Enter goes to the first match
  if (e.key === 'Enter' && airportData && airportData.airports.length) { e.preventDefault(); showAirport(airportData.airports[0]); }
};

// What a search tab put on the map goes when it is left, or when a target is chosen: the airport's circle, the chosen
// fix and the "all on the map" dots.
function clearAirport() {
  airportGroup.clearLayers();
  airportChosen = null;
  if (airportData) renderAirports();
}
function clearFixes() {
  fixGroup.clearLayers();
  fixAllGroup.clearLayers();
  fixChosen = null;
  $('#fixall').checked = false;
  if (fixData) renderFixes();
}

function showTab(name) {
  for (const t of ['watch', 'fixes', 'airports']) {
    $('#tab-' + t).hidden = name !== t;
    $('#tab' + t).classList.toggle('on', name === t);
  }
  if (name !== 'airports') clearAirport();
  if (name !== 'fixes') clearFixes();
  if (name === 'fixes') { loadFixes(); drawAllFixes(); }
  if (name === 'airports') loadAirports();
}
$('#tabwatch').onclick = () => showTab('watch');
$('#tabfixes').onclick = () => showTab('fixes');
$('#tabairports').onclick = () => showTab('airports');
$('#fixq').oninput = () => { clearTimeout(fixTimer); fixTimer = setTimeout(loadFixes, 200); };
$('#fixq').onkeydown = e => {   // Enter goes to the first match
  if (e.key === 'Enter' && fixData && fixData.fixes.length) { e.preventDefault(); showFix(fixData.fixes[0]); }
};
$('#fixsort').onchange = renderFixes;
$('#fixall').onchange = drawAllFixes;

// ---- the menu: one place to put the screens that are not the map ----
function toggleMenu(on) {
  const open = on ?? $('#menu').hidden;
  $('#menu').hidden = !open; $('#menubtn').className = open ? 'on' : '';
}
$('#menubtn').onclick = e => { toggleMenu(); if (e && e.stopPropagation) e.stopPropagation(); };
if (document.addEventListener) document.addEventListener('click', e => { if ($('#menu').hidden || (e.target && e.target.id === 'menubtn')) return; toggleMenu(false); });

function tick() { $('#clock').textContent = new Date().toISOString().slice(0, 19).replace('T', ' ') + 'Z'; showRadarBadge(); showSatBadge(); }
tick();
setInterval(tick, 1000);

try { if (localStorage.getItem('radar') === '1') radarLayer.addTo(map); } catch (e) { /* default: off */ }
try { if (localStorage.getItem('sat') === '1') satGroup.addTo(map); } catch (e) { /* default: off */ }
refresh();
// Every 30 s: update the list and redraw the selected aircraft, leaving the map view,
// the highlight and any open message details alone.
setInterval(async () => {
  try {
    await refresh();
    const w = watches.find(x => x.id === selected);
    if (w) await showTrack(w, false);
  } catch (e) { /* transient: try again next tick */ }
}, 30000);
</script>
</body>
</html>
