# Copy to config.yaml (git-ignored) and edit.
listen: 127.0.0.1:8080        # a non-loopback address requires auth below
db_path: data/fullflight.db

auth:                          # HTTP basic auth; leave empty only on loopback
  username: ""
  password: ""

adsb:
  sources: [adsb.lol, adsb.fi] # tried in order; first to answer wins
  spread: true                 # take turns at being asked first, so each source carries a share of the load
                               # (false: always the first in the list; airplanes.live is always last)
  lol_api_key: ""              # optional: adsb.lol's API key (from adsb.lol, for feeders or on request), sent with every request to it
  # airplanes.live can be added at the end once its operators have given you access (api.airplanes.live
  # answers 403 until then; a source that refuses us is left alone for an hour).

poll:
  waiting: 3m                  # flight entries not yet matched to an aircraft
  tracking: 45s                # aircraft being followed
                               # (one not heard from for 5 minutes is asked about only every 4x this, to stay within the feeds' rate limits)
  stopover_grace: 3h           # flight watch ends after this long on the ground

navdata:
  dir: data/navdata            # optional waypoint database; fetch it with: fullflight -fetch-navdata

aerodatabox:                   # optional: find a flight by number when ADS-B has lost it (mid-ocean)
  api_key: ""                  # RapidAPI key for AeroDataBox; empty turns this off
  every: 30m                   # least time between lookups for one watch; each one uses your quota

backfill:                      # optional: fill in the track from before an aircraft was followed, from adsb.lol's daily archives
  enabled: false               # each day is 3 to 4 GB; nothing is downloaded unless this is on and you start it from the menu
  cache_dir: ""                # where the downloaded days are kept, e.g. /Volumes/External/FullFlightCache; must exist
  cache_max_gib: 20            # the oldest days are deleted from the cache to stay within this

map_tiles:                     # optional: keep OpenStreetMap's tiles here, so several browsers cost OSM one request per tile
  cache: false                 # off: each browser fetches tiles from OSM itself
  dir: data/tiles              # where they are kept
  max_mib: 500                 # the oldest are deleted to stay within this

weather:                       # optional: keep the radar around followed flights, to see the weather they flew through
  record: false                # off: nothing is fetched. RainViewer keeps only the last two hours, so this must run to record
  dir: data/weather            # where the tiles are kept
  max_mib: 1024                # the oldest frames are deleted to stay within this
  every: 30m                   # how often to visit RainViewer (10m to 100m; it lists only 2 hours, so a missed visit loses radar for good)
  step: 20m                    # time between the frames kept (10m, 20m, 30m ... 1h); RainViewer makes one every 10m